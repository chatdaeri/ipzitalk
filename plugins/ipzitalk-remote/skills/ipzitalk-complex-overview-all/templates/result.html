<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Ipzi Talk · 아파트 한눈에 보기</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#171b22;--sub:#667080;--line:#e3e7ed;--chip:#f5f7fa;--brand:#2f6bff;--brand-s:#e8f0ff;--warn:#b85c00;--warn-s:#fff0df;--shadow:0 12px 34px -20px rgba(20,30,45,.3);--mono:"SF Mono",ui-monospace,Menlo,monospace}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171c23;--ink:#edf1f6;--sub:#9ba5b2;--line:#29313b;--chip:#1f252d;--brand-s:#182747;--warn:#f2a65a;--warn-s:#352315;--shadow:0 14px 34px rgba(0,0,0,.45)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5;padding:24px 14px}.wrap{max-width:1160px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);overflow:hidden}.pad{padding:20px}.hero{margin-bottom:14px}.eyebrow{color:var(--brand);font:800 12px/1 var(--mono);letter-spacing:.05em}.hero h1{font-size:28px;letter-spacing:-.04em;margin:10px 0 5px}.muted{color:var(--sub);font-size:13px}.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:16px}.metric{background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:13px}.metric b{display:block;font:800 20px/1.2 var(--mono)}.metric span{color:var(--sub);font-size:11px}.section{margin-top:14px}.section h2{font-size:17px;margin:0 0 12px}.rows{display:grid;gap:8px}.row{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.row:last-child{border:0}.row .k{color:var(--sub)}.item{background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:13px}.item h3{font-size:14px;margin:0 0 5px}.item p{margin:2px 0;color:var(--sub);font-size:12px}.pill{display:inline-block;background:var(--brand-s);color:var(--brand);border-radius:999px;padding:5px 9px;font:800 11px/1 var(--mono)}.map{height:410px;overflow-x:auto;overflow-y:hidden;background:var(--chip)}.map iframe{display:block;width:100%;min-width:720px;height:100%;border:0}.empty{color:var(--sub);font-size:13px;padding:16px;background:var(--chip);border-radius:12px}.link{color:var(--brand);font-weight:750;text-decoration:none}.note{margin-top:14px;color:var(--sub);font-size:12px}.warn{background:var(--warn-s);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:12px;font-weight:700}@media(max-width:820px){.g2,.g3,.metrics{grid-template-columns:1fr 1fr}.row{grid-template-columns:110px 1fr}}@media(max-width:520px){.g2,.g3,.metrics{grid-template-columns:1fr}.hero h1{font-size:23px}}
</style>
</head>
<body>
<main class="wrap">
  <section class="card hero"><div class="pad">
    <div class="eyebrow">IPZI TALK</div>
    <h1 id="title">아파트 한눈에 보기</h1>
    <div class="muted" id="subtitle"></div>
    <div class="metrics" id="metrics"></div>
  </div></section>

  <section class="card section" id="goal-box" style="display:none"><div class="pad">
    <h2>목적 맞춤 요약</h2>
    <div class="muted" id="goal-purpose"></div>
    <div class="rows" id="goal-conclusions"></div>
  </div></section>

  <section class="grid g2">
    <article class="card"><div class="pad"><h2>단지 기본정보</h2><div class="rows" id="basic"></div></div></article>
    <article class="card"><div class="pad"><h2>입지 요약</h2><div class="grid g3" id="poi"></div></div></article>
  </section>

  <section class="card section"><div class="pad">
    <h2>인근 아파트</h2>
    <div class="grid g3" id="nearby"></div>
  </div></section>

  <section class="card section"><div class="pad">
    <h2>지역 최근 분양공고</h2>
    <div class="grid g3" id="presales"></div>
  </div></section>

  <section class="card section" id="map-card" style="display:none">
    <div class="map"><iframe id="map-iframe" src="about:blank" title="주변 지도" loading="lazy" sandbox="allow-scripts allow-same-origin" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <div class="pad muted" id="map-caption"></div>
  </section>

  <section class="note" id="notes"></section>
</main>

<script type="application/json" id="ipzi-data">{}</script>
<script>
const templateDataShape = {
  title: "",
  subtitle: "",
  goal: null,
  metrics: [],
  basic: [],
  poi: [],
  nearby: [],
  nearbyStatus: "",
  presales: [],
  presaleStatus: "",
  map: { url: null, caption: "", ttlNote: "" },
  notes: [],
  sources: [],
  collectedAt: ""
};
const parsedTemplateData = JSON.parse(document.getElementById("ipzi-data").textContent);
const templateData = Object.keys(parsedTemplateData).length ? parsedTemplateData : templateDataShape;

(function(){
  var D=templateData||{}, NA="확인되지 않음";
  function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function safeHttpsUrl(value){
    try{var url=new URL(String(value==null?"":value));if(url.protocol !== "https:")return null;return url.href;}catch(_){return null;}
  }
  function safeMapUrl(value){
    var safe=safeHttpsUrl(value);if(!safe)return null;
    var url=new URL(safe);
    if(["https://ipji-talk.com","https://ipzi-talk.synergylabs.kr","https://presale-remote-mcp-loadtest.jinju-c67.workers.dev"].indexOf(url.origin)<0)return null;
    if(url.username||url.password)return null;
    if(url.pathname !== "/map")return null;
    if(!url.searchParams.get("d"))return null;
    if(url.searchParams.getAll("d").length!==1||Array.from(url.searchParams.keys()).some(function(k){return k!=="d";})||url.hash)return null;
    return url.href;
  }
  function set(id,v){document.getElementById(id).textContent=v==null?"":v;}
  function empty(text){return '<div class="empty">'+esc(text||NA)+'</div>';}

  set("title",D.title||"아파트 한눈에 보기");
  set("subtitle",D.subtitle||"");
  if(D.goal){
    document.getElementById("goal-box").style.display="";
    set("goal-purpose",D.goal.purpose||"");
    document.getElementById("goal-conclusions").innerHTML=(D.goal.conclusions||[]).map(function(c){
      return '<div class="row"><div class="k">결론</div><div>'+esc(c)+'</div></div>';
    }).join("");
  }
  document.getElementById("metrics").innerHTML=(D.metrics||[]).map(function(m){
    return '<div class="metric"><b>'+esc(m.value==null?NA:m.value)+'</b><span>'+esc(m.label||"")+'</span></div>';
  }).join("")||empty();
  document.getElementById("basic").innerHTML=(D.basic||[]).map(function(r){
    return '<div class="row"><div class="k">'+esc(r.label||"")+'</div><div>'+esc(r.value==null?NA:r.value)+'</div></div>';
  }).join("")||empty();
  document.getElementById("poi").innerHTML=(D.poi||[]).map(function(p){
    return '<div class="item"><span class="pill">'+esc(p.axis||"입지")+'</span><h3>'+esc(p.name||NA)+'</h3><p>'+esc(p.distance||"")+'</p><p>'+esc(p.note||"")+'</p></div>';
  }).join("")||empty();
  document.getElementById("nearby").innerHTML=(D.nearby||[]).map(function(n){
    var detail=[n.distance,n.totalUnits,n.approvalDate].filter(Boolean).map(esc).join(" · ");
    return '<div class="item"><h3>'+esc(n.name||NA)+'</h3><p>'+detail+'</p><p>'+esc(n.address||"")+'</p></div>';
  }).join("")||empty(D.nearbyStatus||"반경 내 확인된 인근 아파트가 없습니다.");
  document.getElementById("presales").innerHTML=(D.presales||[]).map(function(p){
    var detail=[p.announcementDate,p.moveInMonth,p.totalSupply].filter(Boolean).map(esc).join(" · ");
    var link=safeHttpsUrl(p.detailUrl);
    return '<div class="item"><h3>'+esc(p.name||NA)+'</h3><p>'+detail+'</p><p>'+esc(p.address||"")+'</p>'+(link?'<a class="link" target="_blank" rel="noopener" href="'+esc(link)+'">공고문 보기</a>':'')+'</div>';
  }).join("")||empty(D.presaleStatus||"최근 6개월 해당 지역에서 확인된 모집공고가 없습니다.");

  var mapUrl=D.map&&safeMapUrl(D.map.url);
  if(mapUrl){
    document.getElementById("map-card").style.display="";
    document.getElementById("map-iframe").src=mapUrl;
    set("map-caption",[D.map.caption,D.map.ttlNote].filter(Boolean).join(" · "));
  }
  var notes=(D.notes||[]).map(function(n){return '<div>'+esc(n)+'</div>';}).join("");
  var sources=(D.sources||[]).map(esc).join(" · ");
  if(sources)notes+='<div>출처: '+sources+'</div>';
  if(D.collectedAt)notes+='<div>기준일: '+esc(D.collectedAt)+'</div>';
  document.getElementById("notes").innerHTML=notes;
})();
</script>
</body>
</html>
