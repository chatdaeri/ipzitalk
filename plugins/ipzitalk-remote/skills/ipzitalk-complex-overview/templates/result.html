<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>단지 개요 요약</title>
<style>
:root{--bg:#e9ebf0;--card:#fff;--ink:#14181e;--sub:#5c6673;--sub2:#8a94a2;--line:#e7eaef;--line2:#f1f3f7;--chip:#f3f5f9;--g:#12a150;--gs:#e7f6ec;--y:#e0a107;--ys:#fbf3dd;--o:#e56f1f;--os:#fbeee2;--x:#9aa4b2;--xs:#eef1f5;--brand:#2f6bff;--bs:#e8f0ff;--r:#e5484d;--rs:#fbe9ea;--shadow:0 1px 2px rgba(16,24,40,.05),0 14px 36px -16px rgba(16,24,40,.22);--mono:"SF Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#161b22;--ink:#eef1f5;--sub:#98a2b0;--sub2:#6b7480;--line:#232a33;--line2:#1c222a;--chip:#1c222a;--gs:#12251a;--ys:#2a2410;--os:#2a1c10;--xs:#1c222a;--bs:#16233f;--rs:#30181b;--shadow:0 8px 30px rgba(0,0,0,.5)}}
:root[data-theme="light"]{--bg:#e9ebf0;--card:#fff;--ink:#14181e;--sub:#5c6673;--line:#e7eaef;--line2:#f1f3f7;--chip:#f3f5f9;--gs:#e7f6ec;--ys:#fbf3dd;--os:#fbeee2;--xs:#eef1f5;--bs:#e8f0ff;--rs:#fbe9ea}
:root[data-theme="dark"]{--bg:#0e1116;--card:#161b22;--ink:#eef1f5;--sub:#98a2b0;--sub2:#6b7480;--line:#232a33;--line2:#1c222a;--chip:#1c222a;--gs:#12251a;--ys:#2a2410;--os:#2a1c10;--xs:#1c222a;--bs:#16233f;--rs:#30181b;--shadow:0 8px 30px rgba(0,0,0,.5)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(120% 75% at 50% -5%,color-mix(in srgb,var(--card) 36%,var(--bg)),var(--bg) 56%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5;padding:26px 16px}.wrap{max-width:1180px;margin:0 auto}.top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;margin-bottom:16px}.kicker{font:700 12px/1 var(--mono);letter-spacing:.04em;color:var(--brand);margin-bottom:10px}.title{display:flex;align-items:center;gap:10px;margin:8px 0 4px;font-size:28px;letter-spacing:-.04em;line-height:1.15}.subtitle{margin:0;color:var(--sub);font-size:14px}.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;font:800 12px/1 var(--mono);white-space:nowrap}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--brand)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.pad{padding:18px 20px}.grid{display:grid;gap:14px}.g2{grid-template-columns:1.1fr .9fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}@media(max-width:860px){.top,.g2,.g3,.g4{grid-template-columns:1fr;display:block}.card{margin-bottom:14px}.title{font-size:22px}}
.metric{border:1px solid var(--line);background:var(--chip);border-radius:14px;padding:14px}.metric .n{font:850 24px/1 var(--mono);letter-spacing:-.04em}.metric .l{margin-top:7px;color:var(--sub);font-size:12px}.section-title{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:850;margin:0 0 12px;letter-spacing:-.02em}.section-title svg{color:var(--brand)}.table{width:100%;border-collapse:collapse;font-size:13.5px}.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}.table th{color:var(--sub);font-weight:700;width:31%}.badge{display:inline-block;border-radius:999px;padding:5px 8px;font:800 11px/1 var(--mono)}.green{background:var(--gs);color:var(--g)}.amber{background:var(--ys);color:var(--y)}.orange{background:var(--os);color:var(--o)}.gray{background:var(--xs);color:var(--x)}.red{background:var(--rs);color:var(--r)}.map{height:390px;background:var(--line2);overflow-x:auto;overflow-y:hidden}.map iframe{display:block;width:100%;min-width:720px;height:100%;border:0}.note{font-size:12px;color:var(--sub);border-top:1px solid var(--line);padding-top:12px;margin-top:14px}.warn{display:inline-flex;gap:6px;align-items:center;color:var(--o);background:var(--os);font:700 11px/1.4 var(--mono);padding:6px 9px;border-radius:8px;margin-bottom:8px}.hero{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hero .big{font-size:42px;font-weight:900;letter-spacing:-.05em}@media(max-width:860px){.hero{grid-template-columns:1fr}}.footlink{color:var(--brand);text-decoration:none;font-weight:800}.small{font-size:12px;color:var(--sub)}
svg.ic{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.18em}
.src{font-size:10.5px;color:var(--sub2);margin:6px 0 0;text-align:right;letter-spacing:-.01em}
</style>
</head>
<body>
<!--
  아이콘 스프라이트 — 인라인 self-contained. <use href="#i-…">는 같은 문서의 <symbol>만 참조한다.
  [주의] 심볼을 임의로 지우지 말 것. 일부 심볼은 마크업이 아니라 아래 ipzi-data/렌더 JS의
  아이콘 문자열로만 참조된다. "안 쓰는 심볼"로 보고 지우면 아이콘이 에러 없이 조용히 사라진다.
  이 블록과 아래 ICONS 배열은 항상 함께 고친다.
-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-complex" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V13h5v8M9 21V6h6v15M15 21V10h5v11"></path><path d="M3 21h18"></path></g></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11Z"></path><circle cx="12" cy="10" r="2.5"></circle></g></symbol>
<symbol id="i-gauge" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17a8 8 0 0 1 16 0"></path><path d="M12 17l4.2-4.2"></path><circle cx="12" cy="17" r="1.3" fill="currentColor" stroke="none"></circle></g></symbol>
<symbol id="i-info" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><circle cx="12" cy="8" r=".9" fill="currentColor" stroke="none"></circle></g></symbol>
<symbol id="i-sample" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 7 20M17 4l-2 16M4 9.5h16M3 15h16"></path></g></symbol>
</svg>

<div class="wrap">
  <div class="top">
    <div>
      <div class="kicker" id="brand">IPZI TALK</div>
      <h1 class="title"><svg class="ic" style="color:var(--brand)"><use href="#i-complex"/></svg><span id="title">–</span></h1>
      <p class="subtitle" id="subtitle"></p>
    </div>
    <div class="pill" id="pill" style="display:none"><span class="dot"></span><span id="pill-label"></span></div>
  </div>

  <div class="card"><div class="pad"><div class="hero">
    <div><div class="big" id="hero-big"></div><p class="subtitle" id="hero-sub"></p></div>
    <div><div class="grid g4" id="hero-metrics"></div></div>
  </div><p class="src">공동주택관리정보시스템(K-apt)</p></div></div>

  <div class="grid g3" style="margin-top:14px">
    <div class="card"><div class="pad">
      <h2 class="section-title"><svg class="ic" style="color:var(--sub)"><use href="#i-pin"/></svg><span id="loc-title">위치 번들</span></h2>
      <table class="table" id="loc-table"></table>
      <p class="src">카카오맵</p>
    </div></div>
    <div class="card"><div class="pad">
      <h2 class="section-title"><svg class="ic" style="color:var(--sub)"><use href="#i-gauge"/></svg><span id="judg-title">한 줄 판단</span></h2>
      <p id="judgment"></p>
    </div></div>
    <div class="card"><div class="pad">
      <h2 class="section-title"><svg class="ic" style="color:var(--sub)"><use href="#i-info"/></svg><span id="caution-title">주의</span></h2>
      <p id="caution"></p>
    </div></div>
  </div>

  <div class="card" id="map-card" style="margin-top:14px;display:none"><div class="map"><iframe id="map-iframe" src="about:blank" title="지도" loading="lazy" sandbox="allow-scripts allow-same-origin" referrerpolicy="strict-origin-when-cross-origin"></iframe></div><div class="pad"><p class="src">네이버 지도 · 카카오맵</p></div></div>
  <p class="small" id="map-cap" style="margin:8px 2px 0;display:none"></p>

  <div class="note" id="note"></div>
</div>

<script type="application/json" id="ipzi-data">{}</script>
<script>
/* 이 템플릿은 고정이다. 실행마다 바뀌는 것은 아래 templateData 블록 하나뿐이다.
   - 스펙 카드의 압축형(단일 단지). 상세 스펙 전체가 필요하면 단지 스펙 카드로 안내한다.
   - 결측 필드는 숨기거나 "정보없음"으로 표기한다. 0으로 채우지 않는다.
   - map.url 이 null 이면 지도 패널이 통째로 숨는다. */
const templateDataShape = {
  brand: "IPZI TALK",
  title: "",                 // "단지 개요 요약"
  subtitle: "",              // "단일 단지 개요를 빠르게 보는 압축 카드"
  pill: "",                  // "요약"

  hero: {
    big: "",                 // "744세대"
    sub: "",                 // "2013년 사용승인 · 11개동 · 시공사 · 분양유형"
    metrics: []              // [{n:"1.57", l:"주차/세대"}, {n:"5분이내", l:"버스 도보"}, ...]
  },

  locationTitle: "",         // "위치 번들"
  location: [],              // [{k:"법정동코드", v:"..."}, {k:"정밀도", v:"단지명 해소", badge:{label:"exact", tone:"green"}}]

  judgmentTitle: "",         // "한 줄 판단"
  judgment: "",              // 세대수·연식·시공사·주차·교통만 사용. 정성 우열 단정 금지.

  cautionTitle: "",          // "주의"
  caution: "",               // K-apt 편의/교육시설 텍스트 빈 괄호 가능 → POI 검증 전 단정 금지 등

  map: {
    url: null,
    caption: "",
    ttlNote: "지도 링크는 발급 후 7일간 유효합니다. 만료되면 지도가 빈 화면으로 뜨므로 재발급이 필요합니다."
  },

  sampleNote: "",            // "개요 요약은 스펙 카드의 압축형입니다."
  hedges: [],                // ["개요 요약은 K-apt 등록정보 기반. 교통/교육/생활 정성 판단은 별도 POI 검증 후."]
  sources: [],               // ["카카오맵", "네이버 지도"]
  collectedAt: ""            // "YYYY-MM-DD"
};
const parsedTemplateData = JSON.parse(document.getElementById("ipzi-data").textContent);
const templateData = Object.keys(parsedTemplateData).length ? parsedTemplateData : templateDataShape;

(function(){
  var D = templateData || {}, NA = "정보없음";
  function esc(v){ return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  /* esc() 는 스킴을 막지 못한다. `javascript:alert(1)` 은 따옴표가 없어 그대로 href 에 들어간다.
     일반 링크는 https만 허용하고, 지도 iframe은 Ipzi Talk 정식 /map?d=<id> URL만 허용한다. */
  function safeHttpsUrl(value){
    try {
      var url = new URL(String(value == null ? "" : value));
      if(url.protocol !== "https:") return null;
      return url.href;
    } catch (_) { return null; }
  }
  function safeMapUrl(value){
    var safe = safeHttpsUrl(value);
    if(!safe) return null;
    var url = new URL(safe);
    if(url.origin !== "https://ipzi-talk.synergylabs.kr") return null;
    if(url.username || url.password) return null;
    if(url.pathname !== "/map") return null;
    if(!url.searchParams.get("d")) return null;
    if(url.searchParams.getAll("d").length !== 1) return null;
    if(Array.from(url.searchParams.keys()).some(function(key){ return key !== "d"; })) return null;
    if(url.hash) return null;
    return url.href;
  }
  /* 스프라이트에 실재하는 심볼만 허용. 없는 id 를 <use> 로 가리키면 브라우저는 조용히 빈 자리를 그린다.
     심볼을 추가/삭제하면 위 sprite 블록과 이 배열을 함께 고칠 것. */
  var ICONS = ["i-complex","i-gauge","i-info","i-pin","i-sample"];
  function icon(id,tone){
    if(!id) return "";
    if(ICONS.indexOf(id)===-1){ console.warn('[result.html] 스프라이트에 없는 아이콘 id: "'+id+'" — 생략합니다.'); return ""; }
    var c = tone ? ' style="color:var(--'+esc(tone)+')"' : "";
    return '<svg class="ic"'+c+'><use href="#'+esc(id)+'"/></svg>';
  }
  function set(id,txt){ var e=document.getElementById(id); if(e) e.textContent = (txt==null?"":txt); }

  set("brand", D.brand||"IPZI TALK");
  set("title", D.title||"–");
  set("subtitle", D.subtitle);
  if(D.pill){ document.getElementById("pill").style.display=""; set("pill-label", D.pill); }

  var hero = D.hero || {};
  set("hero-big", hero.big || NA);
  set("hero-sub", hero.sub);
  document.getElementById("hero-metrics").innerHTML = (hero.metrics||[]).map(function(m){
    return '<div class="metric"><div class="n">'+esc(m.n==null||m.n===""?NA:m.n)+'</div><div class="l">'+esc(m.l)+'</div></div>';
  }).join("");

  if(D.locationTitle) set("loc-title", D.locationTitle);
  document.getElementById("loc-table").innerHTML = (D.location||[]).map(function(row){
    var b = row.badge ? '<span class="badge '+esc(row.badge.tone||"gray")+'">'+esc(row.badge.label)+'</span> ' : "";
    var v = (row.v==null||row.v==="") ? '<span class="badge gray">'+NA+'</span>' : esc(row.v);
    return '<tr><th>'+esc(row.k)+'</th><td>'+b+v+'</td></tr>';
  }).join("");

  if(D.judgmentTitle) set("judg-title", D.judgmentTitle);
  set("judgment", D.judgment || NA);
  if(D.cautionTitle) set("caution-title", D.cautionTitle);
  set("caution", D.caution || NA);

  if(D.map && D.map.url){
    document.getElementById("map-card").style.display="";
    document.getElementById("map-iframe").src = safeMapUrl(D.map.url) || "about:blank";
    var cap = [D.map.caption, D.map.ttlNote].filter(Boolean);
    if(cap.length){
      var mc = document.getElementById("map-cap");
      mc.innerHTML = esc(cap[0]) + (cap[1] ? '<br><strong>'+esc(cap[1])+'</strong>' : "");
      mc.style.display="";
    }
  }

  var n = '<div class="warn">'+icon("i-sample")+esc(D.sampleNote||"")+'</div>';
  (D.hedges||[]).forEach(function(h){ n += '<br>'+esc(h); });
  var src = '<br>데이터: <a class="footlink" href="https://www.k-apt.go.kr/web/main/index.do" target="_blank" rel="noopener">공동주택관리정보시스템(K-apt)</a>';
  (D.sources||[]).forEach(function(s){ src += ' · '+esc(s); });
  if(D.collectedAt) src += ' · 기준일 '+esc(D.collectedAt);
  document.getElementById("note").innerHTML = n + src;
})();
</script>
</body>
</html>
