<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>단지 스펙 카드</title>
<style>
:root{--bg:#e9ebf0;--card:#fff;--ink:#14181e;--sub:#5c6673;--sub2:#8a94a2;--line:#e7eaef;--line2:#f1f3f7;--chip:#f3f5f9;--g:#12a150;--gs:#e7f6ec;--y:#e0a107;--ys:#fbf3dd;--o:#e56f1f;--os:#fbeee2;--x:#9aa4b2;--xs:#eef1f5;--brand:#2f6bff;--bs:#e8f0ff;--r:#e5484d;--rs:#fbe9ea;--shadow:0 1px 2px rgba(16,24,40,.05),0 14px 36px -16px rgba(16,24,40,.22);--mono:"SF Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#161b22;--ink:#eef1f5;--sub:#98a2b0;--sub2:#6b7480;--line:#232a33;--line2:#1c222a;--chip:#1c222a;--gs:#12251a;--ys:#2a2410;--os:#2a1c10;--xs:#1c222a;--bs:#16233f;--rs:#30181b;--shadow:0 8px 30px rgba(0,0,0,.5)}}
:root[data-theme="light"]{--bg:#e9ebf0;--card:#fff;--ink:#14181e;--sub:#5c6673;--line:#e7eaef;--line2:#f1f3f7;--chip:#f3f5f9;--gs:#e7f6ec;--ys:#fbf3dd;--os:#fbeee2;--xs:#eef1f5;--bs:#e8f0ff;--rs:#fbe9ea}
:root[data-theme="dark"]{--bg:#0e1116;--card:#161b22;--ink:#eef1f5;--sub:#98a2b0;--sub2:#6b7480;--line:#232a33;--line2:#1c222a;--chip:#1c222a;--gs:#12251a;--ys:#2a2410;--os:#2a1c10;--xs:#1c222a;--bs:#16233f;--rs:#30181b;--shadow:0 8px 30px rgba(0,0,0,.5)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(120% 75% at 50% -5%,color-mix(in srgb,var(--card) 36%,var(--bg)),var(--bg) 56%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5;padding:26px 16px}.wrap{max-width:1180px;margin:0 auto}.top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;margin-bottom:16px}.kicker{font:700 12px/1 var(--mono);letter-spacing:.04em;color:var(--brand);margin-bottom:10px}.title{display:flex;align-items:center;gap:10px;margin:8px 0 4px;font-size:28px;letter-spacing:-.04em;line-height:1.15}.subtitle{margin:0;color:var(--sub);font-size:14px}.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;font:800 12px/1 var(--mono);white-space:nowrap}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--brand)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.pad{padding:18px 20px}.grid{display:grid;gap:14px}.g2{grid-template-columns:1.1fr .9fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}@media(max-width:860px){.top,.g2,.g3,.g4{grid-template-columns:1fr;display:block}.card{margin-bottom:14px}.title{font-size:22px}}
.metric{border:1px solid var(--line);background:var(--chip);border-radius:14px;padding:14px}.metric .n{font:850 24px/1 var(--mono);letter-spacing:-.04em}.metric .l{margin-top:7px;color:var(--sub);font-size:12px}.section-title{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:850;margin:0 0 12px;letter-spacing:-.02em}.section-title svg{color:var(--brand)}.table{width:100%;border-collapse:collapse;font-size:13.5px}.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}.table th{color:var(--sub);font-weight:700;width:31%}.table.cmp th{width:24%}.table.cmp td:nth-child(3){background:color-mix(in srgb,var(--bs) 42%,transparent)}
.mix{display:grid;gap:10px}.mix .m{display:grid;grid-template-columns:86px 1fr 54px;align-items:center;gap:10px;font-size:13px}.mix .track{height:10px;background:var(--line2);border-radius:99px;overflow:hidden}.mix .track i{display:block;height:100%;background:var(--brand);border-radius:99px}.val{font:800 13px/1 var(--mono);text-align:right}
.badge{display:inline-block;border-radius:999px;padding:5px 8px;font:800 11px/1 var(--mono)}.green{background:var(--gs);color:var(--g)}.amber{background:var(--ys);color:var(--y)}.orange{background:var(--os);color:var(--o)}.gray{background:var(--xs);color:var(--x)}.red{background:var(--rs);color:var(--r)}.blue{background:var(--bs);color:var(--brand)}
.map{height:390px;background:var(--line2);overflow-x:auto;overflow-y:hidden}.map iframe{display:block;width:100%;min-width:720px;height:100%;border:0}.note{font-size:12px;color:var(--sub);border-top:1px solid var(--line);padding-top:12px;margin-top:14px}.warn{display:inline-flex;gap:6px;align-items:center;color:var(--o);background:var(--os);font:700 11px/1.4 var(--mono);padding:6px 9px;border-radius:8px;margin-bottom:8px}.footlink{color:var(--brand);text-decoration:none;font-weight:800}.small{font-size:12px;color:var(--sub)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch;margin-bottom:14px}.vs .mark{align-self:center;border-radius:999px;background:var(--ink);color:var(--card);font:900 12px/1 var(--mono);padding:8px 9px}.namebox{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px}.namebox h2{margin:0;font-size:22px;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}.address{margin:5px 0 0;color:var(--sub);font-size:13px}.summary{display:grid;gap:10px}.summary .item{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--chip)}.item b{display:block;margin-bottom:4px}.diff{font:850 18px/1 var(--mono);letter-spacing:-.03em}@media(max-width:860px){.vs{grid-template-columns:1fr}.vs .mark{justify-self:center}.table{font-size:12.5px}}
svg.ic{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.18em}
.src{font-size:10.5px;color:var(--sub2);margin:6px 0 0;text-align:right;letter-spacing:-.01em}
</style>
</head>
<body>
<!--
  아이콘 스프라이트 — 인라인 self-contained. <use href="#i-…">는 같은 문서의 <symbol>만 참조한다.
  [주의] 심볼을 임의로 지우지 말 것. 심볼은 마크업이 아니라 아래 ipzi-data/렌더 JS의
  아이콘 문자열로만 참조된다. "안 쓰는 심볼"로 보고 지우면 아이콘이 에러 없이 조용히 사라진다.
  이 블록과 아래 ICONS 배열은 항상 함께 고친다.
-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-complex" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V13h5v8M9 21V6h6v15M15 21V10h5v11"></path><path d="M3 21h18"></path></g></symbol>
<symbol id="i-map" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"></path><path d="M9 4v14M15 6v14"></path></g></symbol>
<symbol id="i-parking" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3.5"></rect><path d="M9.5 16.5V7.5h3.6a2.7 2.7 0 0 1 0 5.4H9.5"></path></g></symbol>
<symbol id="i-size" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="10" width="8" height="11" rx="1"></rect><rect x="13" y="4" width="8" height="17" rx="1"></rect></g></symbol>
<symbol id="i-compare" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M6 20h12"></path><path d="M12 6 5 8.5M12 6l7 2.5"></path><path d="M2 13l3-6 3 6a3 3 0 0 1-6 0ZM16 13l3-6 3 6a3 3 0 0 1-6 0Z"></path></g></symbol>
<symbol id="i-age" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="10" height="15" rx="1"></rect><path d="M6 10h1.5M9.5 10H11M6 14h1.5M9.5 14H11"></path><circle cx="17.5" cy="8.5" r="3.5"></circle><path d="M17.5 6.9V8.5l1.2.8"></path></g></symbol>
<symbol id="i-subway" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="14" rx="3"></rect><path d="M5 11h14"></path><path d="M8.5 7h7"></path><circle cx="9" cy="14" r=".7" fill="currentColor" stroke="none"></circle><circle cx="15" cy="14" r=".7" fill="currentColor" stroke="none"></circle><path d="M8 17l-2 4M16 17l2 4"></path></g></symbol>
<symbol id="i-sample" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 7 20M17 4l-2 16M4 9.5h16M3 15h16"></path></g></symbol>
</svg>

<div class="wrap">
  <div class="top">
    <div>
      <div class="kicker" id="brand">IPZI TALK</div>
      <h1 class="title"><span id="title-icon"></span><span id="title">–</span></h1>
      <p class="subtitle" id="subtitle"></p>
    </div>
    <div class="pill" id="pill" style="display:none"><span class="dot"></span><span id="pill-label"></span></div>
  </div>

  <div id="single" style="display:none">
    <div class="grid g2">
      <div class="card"><div class="pad">
        <h2 class="section-title"><span id="s-spec-icon"></span><span id="s-spec-title">핵심 스펙</span></h2>
        <div class="grid g4" id="s-metrics"></div>
        <table class="table" id="s-spec"></table>
        <p class="src">공동주택관리정보시스템(K-apt)</p>
      </div></div>
      <div class="card" id="s-map-card">
        <div class="map" id="s-map-wrap"><iframe id="s-map-iframe" src="about:blank" title="지도" loading="lazy" sandbox="allow-scripts allow-same-origin" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
        <div class="pad"><h2 class="section-title"><span id="s-map-icon"></span>지도</h2><p class="small" id="s-map-note"></p><p class="src">네이버 지도 · 카카오맵</p></div>
      </div>
    </div>
    <div class="grid g2" style="margin-top:14px">
      <div class="card"><div class="pad">
        <h2 class="section-title"><span id="s-parking-icon"></span><span id="s-parking-title">주차/면적</span></h2>
        <table class="table" id="s-parking"></table>
        <p class="src">공동주택관리정보시스템(K-apt)</p>
      </div></div>
      <div class="card"><div class="pad">
        <h2 class="section-title"><span id="s-mix-icon"></span><span id="s-mix-title">면적 믹스</span></h2>
        <div class="mix" id="s-mix"></div>
        <p class="src">공동주택관리정보시스템(K-apt)</p>
      </div></div>
    </div>
  </div>

  <div id="compare" style="display:none">
    <div class="vs" id="c-vs"></div>
    <div class="grid">
      <div class="card"><div class="pad">
        <h2 class="section-title"><span id="c-table-icon"></span><span id="c-table-title">비교표</span></h2>
        <table class="table cmp" id="c-table"></table>
        <p class="src">공동주택관리정보시스템(K-apt)</p>
      </div></div>
      <div class="card"><div class="pad">
        <h2 class="section-title"><span id="c-summary-icon"></span><span id="c-summary-title">주요 차이</span></h2>
        <div class="summary" id="c-summary"></div>
        <p class="src">공동주택관리정보시스템(K-apt)</p>
      </div></div>
    </div>
    <div class="grid g3" id="c-diffcards" style="margin-top:14px"></div>
  </div>

  <p class="small" id="map-cap" style="margin:8px 2px 0;display:none"></p>
  <div class="note" id="note"></div>
</div>

<script type="application/json" id="ipzi-data">{}</script>
<script>
/* 이 템플릿은 고정이다. 실행마다 바뀌는 것은 아래 templateData 블록 하나뿐이다.
   - complexes 길이로 분기한다: 1개면 단일 스펙 카드, 2개 이상이면 비교 모드.
   - 결측 필드는 0이 아니라 "정보없음"이다. 비교 모드에서 한쪽에 없는 값은 다른 단지 값으로 보정하지 않는다.
   - map.url 이 null 이면 단일 모드 지도 카드가 숨는다. */
const templateDataShape = {
  brand: "IPZI TALK",
  title: "",                 // "단지 스펙 카드" | "단지 스펙 비교"
  subtitle: "",
  pill: "",

  complexes: [],             // 1개 = 단일 스펙, 2개 이상 = 비교.
                             // [{
                             //   name, address, kaptCode,
                             //   metrics:[{n,l}],            // 핵심 4카드 / VS 카드
                             //   specRows:[{k,v}],           // (단일) K-apt 상세 표
                             //   parkingRows:[{k,v}],        // (단일) 주차/면적 표
                             //   mix:[{label, pct, count}]   // (단일) 면적 믹스
                             // }]

  compare: {                 // 비교 모드(complexes.length>=2)에서만 사용
    rows: [],                // [{k, cells:["A값","B값"], diff:{text, badge:{label,tone}}}]  cells 길이 = complexes 길이
    summary: [],             // [{title, diff, note}]
    diffCards: []            // [{icon:"i-parking", title, n, l, note}]
  },

  map: {
    url: null,
    caption: "",
    ttlNote: "지도 링크는 발급 후 7일간 유효합니다. 만료되면 지도가 빈 화면으로 뜨므로 재발급이 필요합니다."
  },

  sampleNote: "",
  hedges: [],                // ["K-apt 등록·관리 데이터 기준. 최신 현장 정보와 다를 수 있음.", ...]
  sources: [],               // ["카카오맵", "네이버 지도"]
  collectedAt: ""
};
const parsedTemplateData = JSON.parse(document.getElementById("ipzi-data").textContent);
const templateData = Object.keys(parsedTemplateData).length ? parsedTemplateData : templateDataShape;

(function(){
  var D = templateData || {}, NA = "정보없음";
  function esc(v){ return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  /* esc() 는 스킴을 막지 못한다. `javascript:alert(1)` 은 따옴표가 없어 그대로 href 에 들어간다.
     일반 링크는 https만 허용하고, 지도 iframe은 Ipzi Talk 정식 /map?d=<id> URL만 허용한다. */
  function safeHttpsUrl(value){
    try {
      var url = new URL(String(value == null ? "" : value));
      if(url.protocol !== "https:") return null;
      return url.href;
    } catch (_) { return null; }
  }
  function safeMapUrl(value){
    var safe = safeHttpsUrl(value);
    if(!safe) return null;
    var url = new URL(safe);
    if(url.origin !== "https://ipzi-talk.synergylabs.kr") return null;
    if(url.username || url.password) return null;
    if(url.pathname !== "/map") return null;
    if(!url.searchParams.get("d")) return null;
    if(url.searchParams.getAll("d").length !== 1) return null;
    if(Array.from(url.searchParams.keys()).some(function(key){ return key !== "d"; })) return null;
    if(url.hash) return null;
    return url.href;
  }
  /* 스프라이트에 실재하는 심볼만 허용. 없는 id 를 <use> 로 가리키면 브라우저는 조용히 빈 자리를 그린다.
     심볼을 추가/삭제하면 위 sprite 블록과 이 배열을 함께 고칠 것. */
  var ICONS = ["i-age","i-compare","i-complex","i-map","i-parking","i-sample","i-size","i-subway"];
  function icon(id,tone){
    if(!id) return "";
    if(ICONS.indexOf(id)===-1){ console.warn('[result.html] 스프라이트에 없는 아이콘 id: "'+id+'" — 생략합니다.'); return ""; }
    var c = tone ? ' style="color:var(--'+esc(tone)+')"' : "";
    return '<svg class="ic"'+c+'><use href="#'+esc(id)+'"/></svg>';
  }
  function set(id,txt){ var e=document.getElementById(id); if(e) e.textContent = (txt==null?"":txt); }
  function html(id,h){ var e=document.getElementById(id); if(e) e.innerHTML = h; }
  function metricHtml(m){ return '<div class="metric"><div class="n">'+esc(m.n==null||m.n===""?NA:m.n)+'</div><div class="l">'+esc(m.l)+'</div></div>'; }
  function rowsTable(rows){ return (rows||[]).map(function(r){ var v=(r.v==null||r.v==="")?'<span class="badge gray">'+NA+'</span>':esc(r.v); return '<tr><th>'+esc(r.k)+'</th><td>'+v+'</td></tr>'; }).join(""); }

  set("brand", D.brand||"IPZI TALK");
  set("subtitle", D.subtitle);
  if(D.pill){ document.getElementById("pill").style.display=""; set("pill-label", D.pill); }

  var complexes = D.complexes || [];
  var compareMode = complexes.length >= 2;
  set("title", D.title||"–");
  html("title-icon", icon(compareMode ? "i-compare" : "i-complex", "brand"));

  if(compareMode){ renderCompare(complexes, D.compare||{}); }
  else { renderSingle(complexes[0]||{}); }

  function renderSingle(cx){
    document.getElementById("single").style.display="";
    html("s-spec-icon", icon("i-complex"));
    html("s-map-icon", icon("i-map"));
    html("s-parking-icon", icon("i-parking"));
    html("s-mix-icon", icon("i-size","sub"));

    html("s-metrics", (cx.metrics||[]).map(metricHtml).join(""));
    html("s-spec", rowsTable(cx.specRows));
    html("s-parking", rowsTable(cx.parkingRows));
    html("s-mix", (cx.mix||[]).map(function(m){
      var pct = (typeof m.pct==="number") ? m.pct : 0;
      return '<div class="m"><b>'+esc(m.label)+'</b><span class="track"><i style="width:'+pct+'%"></i></span><span class="val">'+esc(m.count==null?NA:m.count)+'</span></div>';
    }).join(""));

    if(D.map && D.map.url){
      document.getElementById("s-map-iframe").src = safeMapUrl(D.map.url) || "about:blank";
      set("s-map-note", (D.map.caption||"") );
      showMapCap();
    } else {
      document.getElementById("s-map-card").style.display="none";
    }
  }

  function renderCompare(cxs, cmp){
    document.getElementById("compare").style.display="";
    html("c-table-icon", icon("i-complex"));
    html("c-summary-icon", icon("i-age"));

    var vs = cxs.map(function(cx){
      return '<div class="card"><div class="pad"><div class="namebox"><div><h2>'+icon("i-complex","sub")+esc(cx.name)+'</h2><p class="address">'+esc(cx.address||NA)+'</p></div></div><div class="grid g4">'+(cx.metrics||[]).map(metricHtml).join("")+'</div></div></div>';
    });
    var vsEl = document.getElementById("c-vs");
    if(cxs.length===2){ vsEl.innerHTML = vs[0] + '<div class="mark">VS</div>' + vs[1]; }
    else { vsEl.style.gridTemplateColumns = "repeat("+cxs.length+",1fr)"; vsEl.innerHTML = vs.join(""); }

    var head = '<tr><th>항목</th>'+cxs.map(function(cx){ return '<th>'+esc(cx.name)+'</th>'; }).join("")+'<th>차이</th></tr>';
    var body = (cmp.rows||[]).map(function(r){
      var cells = (r.cells||[]).map(function(c){ return '<td>'+((c==null||c==="")?'<span class="badge gray">'+NA+'</span>':esc(c))+'</td>'; }).join("");
      var diff = "-";
      if(r.diff){ var b=r.diff.badge?'<span class="badge '+esc(r.diff.badge.tone||"gray")+'">'+esc(r.diff.badge.label)+'</span> ':''; diff = b+esc(r.diff.text||""); }
      return '<tr><th>'+esc(r.k)+'</th>'+cells+'<td>'+diff+'</td></tr>';
    }).join("");
    html("c-table", head+body);

    html("c-summary", (cmp.summary||[]).map(function(it){
      return '<div class="item"><b>'+esc(it.title)+'</b>'+(it.diff?'<span class="diff">'+esc(it.diff)+'</span>':'')+(it.note?'<p class="small">'+esc(it.note)+'</p>':'')+'</div>';
    }).join(""));

    html("c-diffcards", (cmp.diffCards||[]).map(function(c){
      return '<div class="card"><div class="pad"><h2 class="section-title">'+icon(c.icon)+'<span>'+esc(c.title)+'</span></h2><div class="metric"><div class="n">'+esc(c.n==null||c.n===""?NA:c.n)+'</div><div class="l">'+esc(c.l)+'</div></div>'+(c.note?'<p class="small">'+esc(c.note)+'</p>':'')+'</div></div>';
    }).join(""));
  }

  function showMapCap(){
    var cap = [D.map.caption, D.map.ttlNote].filter(Boolean);
    if(cap.length){
      var mc = document.getElementById("map-cap");
      mc.innerHTML = esc(cap[0]) + (cap[1] ? '<br><strong>'+esc(cap[1])+'</strong>' : "");
      mc.style.display="";
    }
  }

  var n = '<div class="warn">'+icon("i-sample")+esc(D.sampleNote||"")+'</div>';
  (D.hedges||[]).forEach(function(h){ n += '<br>'+esc(h); });
  var src = '<br>데이터: <a class="footlink" href="https://www.k-apt.go.kr/web/main/index.do" target="_blank" rel="noopener">공동주택관리정보시스템(K-apt)</a>';
  (D.sources||[]).forEach(function(s){ src += ' · '+esc(s); });
  if(D.collectedAt) src += ' · 기준일 '+esc(D.collectedAt);
  document.getElementById("note").innerHTML = n + src;
})();
</script>
</body>
</html>
