<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>초품아 진단</title>
<style>
  :root{
    --bg:#e9ebf0; --card:#ffffff; --ink:#14181e; --sub:#5c6673; --sub2:#8a94a2;
    --line:#e7eaef; --line2:#f1f3f7; --chip:#f3f5f9;
    --g:#12a150; --g-s:#e7f6ec; --y:#e0a107; --y-s:#fbf3dd;
    --o:#e56f1f; --o-s:#fbeee2; --x:#9aa4b2; --x-s:#eef1f5;
    --brand:#2f6bff; --brand-s:#e8f0ff;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 14px 36px -16px rgba(16,24,40,.22);
    --mono:"SF Mono",ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0e1116; --card:#161b22; --ink:#eef1f5; --sub:#98a2b0; --sub2:#6b7480;
           --line:#232a33; --line2:#1c222a; --chip:#1c222a;
           --g-s:#12251a; --y-s:#2a2410; --o-s:#2a1c10; --x-s:#1c222a; --brand-s:#16233f;
           --shadow:0 8px 30px rgba(0,0,0,.5); }
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(130% 70% at 50% -5%, color-mix(in srgb,var(--card) 30%,var(--bg)), var(--bg) 55%);
    color:var(--ink);min-height:100vh;
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased;padding:22px 14px;}
  .wrap{max-width:1080px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;}
  .ic{width:1.05em;height:1.05em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.16em;flex:none}
  .sdot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:middle}
  .sdot.big{width:15px;height:15px}
  .s-g{background:var(--g)}.s-a{background:var(--y)}.s-o{background:var(--o)}.s-x{background:var(--x)}

  .topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;padding:24px 24px 20px;border-bottom:1px solid var(--line2)}
  .ttl{display:flex;flex-direction:column;font-size:26px;font-weight:800;letter-spacing:-.02em}
  .ttl .row{display:flex;align-items:center;gap:10px}
  .eyebrow{font:700 12px/1 var(--mono);color:var(--brand);letter-spacing:.04em;margin-bottom:10px}
  .ttl .sub{font-size:14px;color:var(--sub);font-weight:500;letter-spacing:0;margin-top:6px}
  .actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .pill{display:flex;align-items:center;gap:8px;padding:7px 13px;border:1px solid var(--line);border-radius:999px;font-weight:800;font-size:13.5px;background:var(--card)}
  .pill .sdot{box-shadow:0 0 0 3px color-mix(in srgb,currentColor 20%,transparent)}
  .open-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;background:var(--brand);color:#fff;border-radius:9px;text-decoration:none;font-size:12.5px;font-weight:700;white-space:nowrap}
  .open-btn:hover{filter:brightness(1.06)}

  /* 지도 iframe 최소폭 720px: /map 페이지 사이드바 280px 고정 때문에 안쪽 지도 영역이
     좁으면 fitBounds가 최소 줌(한반도)으로 떨어진다. 좁은 화면에서는 카드가 가로 스크롤된다. */
  .map{position:relative;width:100%;height:50vh;min-height:360px;max-height:600px;background:var(--line2);overflow-x:auto;overflow-y:hidden}
  .map iframe{display:block;width:100%;min-width:720px;height:100%;border:0}

  .panel{padding:18px 22px 26px}
  .cap{font:600 11px/1.4 var(--mono);color:var(--sub2);margin:0 0 14px;letter-spacing:.01em}
  .stat{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  .stat .box{background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:10px 16px;text-align:center;min-width:96px}
  .stat .n{font:800 18px/1 var(--mono);display:flex;align-items:center;justify-content:center;gap:6px;min-height:20px}
  .stat .l{font-size:11px;color:var(--sub);margin-top:5px}

  .ctrl{margin:0 0 18px}
  .ctrl label{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:6px}
  .ctrl label b{color:var(--ink);font-family:var(--mono)}
  input[type=range]{width:100%;accent-color:var(--brand);height:22px}
  .axis{position:relative;height:52px;margin-top:2px}
  .axis .track{position:absolute;left:0;right:0;top:24px;height:6px;border-radius:99px}
  .axis .thr{position:absolute;top:11px;width:2px;height:30px;background:var(--brand);border-radius:2px;transition:left .12s}
  .axis .thr::after{content:attr(data-r);position:absolute;top:-15px;left:50%;transform:translateX(-50%);font:700 9.5px/1 var(--mono);color:var(--brand);white-space:nowrap}
  .axis .pin{position:absolute;top:19px;width:9px;height:9px;border-radius:50%;transform:translateX(-50%);border:2px solid var(--card);transition:opacity .12s}
  .axis .scale{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;font:600 9.5px/1 var(--mono);color:var(--sub2)}
  .legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--sub);margin-top:4px}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:-1px}

  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:2px 22px}
  .item{display:flex;align-items:center;justify-content:space-between;padding:10px 2px;border-bottom:1px solid var(--line2);font-size:14px}
  .item.out{opacity:.32}
  .item.aux .nm{color:var(--sub)}
  .auxtag{font:700 9.5px/1 var(--mono);color:var(--sub2);border:1px solid var(--line);border-radius:999px;padding:3px 6px;margin-left:2px}
  .item .nm{display:flex;align-items:center;gap:9px}
  .item .rank{width:19px;height:19px;border-radius:6px;background:var(--chip);border:1px solid var(--line);font:700 11px/1 var(--mono);display:grid;place-items:center;color:var(--sub2)}
  .item .d{display:flex;align-items:center;gap:7px;font:700 13px/1 var(--mono)}

  .foot{font-size:11.5px;color:var(--sub);border-top:1px solid var(--line);padding-top:14px;margin-top:16px}
  .foot .cav{display:inline-flex;align-items:center;gap:6px;font:600 10.5px/1.4 var(--mono);color:var(--o);background:var(--o-s);padding:6px 9px;border-radius:7px;margin-bottom:8px}
  .cta{display:inline-flex;align-items:center;gap:7px;margin:6px 0 4px;padding:8px 13px;background:var(--brand);color:#fff;border-radius:10px;text-decoration:none;font-size:12.5px;font-weight:700}
  .src{font-size:10.5px;color:var(--sub2);margin:6px 0 0;text-align:right;letter-spacing:-.01em}

  /* 정본 L0 토큰 보강 */
  :root{ --r:#e5484d; --r-s:#fbeaeb; --zebra:#fafbfc; --up:#e5484d; --down:#2f6bff; }
  @media (prefers-color-scheme:dark){
    :root{ --g:#38cf7a; --y:#e8b53f; --o:#f0813e; --r:#f05a5f; --r-s:#301619;
           --x:#8b95a3; --brand:#5b8bff; --zebra:#181d25; --up:#f05a5f; --down:#5b8bff; }
  }
  :root[data-theme="light"]{ --bg:#e9ebf0; --card:#ffffff; --ink:#14181e; --sub:#5c6673; --sub2:#8a94a2; --line:#e7eaef; --line2:#f1f3f7; --chip:#f3f5f9; --g:#12a150; --y:#e0a107; --o:#e56f1f; --r:#e5484d; --x:#9aa4b2; --brand:#2f6bff; --zebra:#fafbfc; }
  :root[data-theme="dark"]{ --bg:#0e1116; --card:#161b22; --ink:#eef1f5; --sub:#98a2b0; --sub2:#6b7480; --line:#232a33; --line2:#1c222a; --chip:#1c222a; --g:#38cf7a; --y:#e8b53f; --o:#f0813e; --r:#f05a5f; --x:#8b95a3; --brand:#5b8bff; --zebra:#181d25; }
</style>
</head>
<body>

<!--
  아이콘 스프라이트 — 인라인이어야 한다. <use href="#i-…">는 같은 문서 안의 <symbol>만 찾는다.
  산출물은 사용자가 혼자 여는 단일 HTML이라 옆에 sprite.svg를 둬도 따라가지 않고 CDN도 금지다.

  [주의] 심볼을 임의로 지우지 말 것. 일부 심볼은 마크업이 아니라 스크립트의 문자열로만 참조되므로
  정적 분석으로는 "안 쓰는 심볼"처럼 보인다. 지우면 아이콘이 에러 없이 조용히 사라진다.
  아래 <symbol> 목록과 스크립트의 ICONS 배열은 항상 같이 고친다.
-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-school" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"></path><path d="M5 21V10l7-4 7 4v11"></path><path d="M10 21v-5h4v5"></path><path d="M8.6 11.5h1.6M13.8 11.5h1.6"></path></g></symbol>
<symbol id="i-map" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"></path><path d="M9 4v14M15 6v14"></path></g></symbol>
<symbol id="i-info" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><circle cx="12" cy="8" r=".9" fill="currentColor" stroke="none"></circle></g></symbol>
</svg>

<div class="wrap">
  <div class="topbar">
    <div class="ttl">
          <span class="eyebrow">IPZI TALK</span>
          <span class="row">
            <svg class="ic"><use id="ttl-ic" href="#i-school"/></svg>
            <span id="badge-title">–</span>
          </span>
          <span class="sub" id="site-sub">–</span>
        </div>
    <div class="actions">
      <span class="pill" id="pill"><span class="sdot" id="pill-dot"></span><span id="pill-label">–</span></span>
      <a class="open-btn" id="open-btn" href="#" target="_blank" rel="noopener"><svg class="ic"><use href="#i-map"/></svg>지도 크게 열기 ↗</a>
    </div>
  </div>

  <div class="map"><iframe id="map-iframe" src="about:blank" title="지도" loading="lazy" sandbox="allow-scripts allow-same-origin" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
  <p class="src">네이버 지도 · 카카오맵</p>

  <div class="panel">
    <div class="cap" id="map-cap">–</div>
    <div class="stat" id="stat"></div>
    <div class="ctrl" id="ctrl">
      <label>목록 반경 필터 <b><span id="rval">–</span><span id="runit">m</span></b></label>
      <input type="range" id="r" min="300" max="1500" step="100" value="1000">
      <div class="axis">
        <div class="track" id="track"></div>
        <div class="thr" id="thr" data-r=""></div>
        <div class="scale" id="scale"></div>
      </div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="list" id="list"></div>
    <p class="src">카카오맵</p>
    <div class="foot">
      <div class="cav"><svg class="ic"><use href="#i-info"/></svg><span id="warn-txt">–</span></div><br>
      <span id="hedge-body"></span><br>
      <a class="cta" id="verify" href="#" target="_blank" rel="noopener" style="display:none"></a><span id="verify-br"></span>
      <span id="foot-note"></span><br>
      <span id="source"></span>
    </div>
  </div>
</div>

<script type="application/json" id="ipzi-data">{}</script>
<script>
/* ────────────────────────────────────────────────────────────────
   이 템플릿은 고정이다. 마크업·CSS·렌더 JS는 실행마다 바뀌지 않는다.
   수정하는 곳은 아래 templateData 블록 하나뿐이다.
   - 값이 없으면 빈 값으로 둔다(문자열 "", 배열 [], 객체 null). 거리를 지어내지 않는다.
   - mapUrl 이 null 이면 지도 패널이 통째로 숨는다.
   - bands / metric / axisMax 등은 판정 규칙 상수라 그대로 둔다(밴드는 절대 기준).
   ──────────────────────────────────────────────────────────────── */
const templateDataShape = {
  iconId:"i-school",
  badgeTitle:"",            // "초품아 진단"
  siteSub:"",               // "단지명 · 주소 (전용 84 기준)"
  signal:{ label:"", cls:"x" },   // cls: g|a|o|x

  mapUrl:null,              // 지도 임베드 URL. null 이면 지도 패널 숨김
  mapCaption:"",            // "SITE(파랑) + 인근 초등학교 · 근린 500m 반경 원 …"
  mapTtl:"지도 링크는 발급 후 7일간 유효합니다. 만료되면 지도가 빈 화면으로 뜨므로 재발급이 필요합니다.",

  metric:"distance", unit:"m", axisMax:1500, radiusDefault:1000,
  bands:[ {max:300,cls:"g",label:"≤300m 아주 가까움 (초품아)"}, {max:500,cls:"a",label:"300–500m 가까움"},
          {max:1000,cls:"o",label:"500m–1km 조금 먼 편"}, {max:Infinity,cls:"x",label:"1km 넘음 · 먼 편"} ],

  stat:[],                  // [{n:"425m",l:"최근접(OO초)",cls:"a"}, {n:"__COUNT__",l:"1km 내 초등"}, {dot:"a",l:"등급"}]
  pois:[],                  // [{n:"OO초 (타 자치구)", d:425}, …]  d = 직선거리(m)

  hedge:{ warn:"", body:"", verify:null, note:"", source:"" }
                            // verify: {label, url, icon:"i-school"}
};
const parsedTemplateData = JSON.parse(document.getElementById("ipzi-data").textContent);
const templateData = Object.keys(parsedTemplateData).length ? parsedTemplateData : templateDataShape;

(function(){
  var D=templateData, C={g:"var(--g)",a:"var(--y)",o:"var(--o)",x:"var(--x)"};
  /* 스프라이트에 실재하는 심볼만 허용한다. 없는 id 를 <use> 로 가리키면 브라우저는 에러 없이
     빈 자리를 그린다. 심볼을 추가/삭제하면 위 <svg> 블록과 이 배열을 함께 고칠 것. */
  var ICONS = ["i-school","i-map","i-info"];
  function iconId(id){
    if(id && ICONS.indexOf(id)===-1){ console.warn('[result.html] 스프라이트에 없는 아이콘 id: "'+id+'" — 기본값으로 대체합니다.'); return "i-info"; }
    return id||"i-info";
  }
  /* 값이 없으면 밴드를 매기지 않는다. null<=500 은 참이라 결측이 최우수 등급으로 둔갑한다. */
  function cls(v){ if(v===null||v===undefined||v==="") return "x";
    for(var i=0;i<D.bands.length;i++){ if(v<=D.bands[i].max) return D.bands[i].cls; } return "x"; }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  /* esc() 는 스킴을 막지 못한다. `javascript:alert(1)` 은 따옴표가 없어 그대로 href 에 들어간다.
     일반 링크는 https만 허용하고, 지도 iframe은 Ipzi Talk 정식 /map?d=<id> URL만 허용한다. */
  function safeHttpsUrl(value){
    try {
      var url = new URL(String(value == null ? "" : value));
      if(url.protocol !== "https:") return null;
      return url.href;
    } catch (_) { return null; }
  }
  function safeMapUrl(value){
    var safe = safeHttpsUrl(value);
    if(!safe) return null;
    var url = new URL(safe);
    if(url.origin !== "https://ipzi-talk.synergylabs.kr") return null;
    if(url.username || url.password) return null;
    if(url.pathname !== "/map") return null;
    if(!url.searchParams.get("d")) return null;
    if(url.searchParams.getAll("d").length !== 1) return null;
    if(Array.from(url.searchParams.keys()).some(function(key){ return key !== "d"; })) return null;
    if(url.hash) return null;
    return url.href;
  }
  /* 결측은 0이 아니다. 0으로 채우면 "데이터 없음"이 "가장 가깝다"로 뒤집힌다. */
  function fmt(v){ if(v===null||v===undefined||v==="") return "정보없음";
    if(isCount) return String(v);
    return v<1000 ? v+"m" : (v/1000).toFixed(1)+"km"; }
  var isCount = D.metric==="count";
  document.getElementById("ttl-ic").setAttribute("href","#"+iconId(D.iconId));
  document.getElementById("badge-title").textContent=D.badgeTitle;
  document.getElementById("site-sub").textContent=D.siteSub;
  var pill=document.getElementById("pill"); pill.style.color=C[D.signal.cls]||"var(--x)";
  document.getElementById("pill-dot").className="sdot s-"+(D.signal.cls||"x");
  document.getElementById("pill-label").textContent=D.signal.label||"자료 부족";
  /* mapUrl 이 null 이면 지도 패널·캡션·열기 버튼을 통째로 숨긴다. */
  if(D.mapUrl){
    document.getElementById("open-btn").href = safeMapUrl(D.mapUrl) || "#";
    document.getElementById("map-iframe").src = safeMapUrl(D.mapUrl) || "about:blank";
    document.getElementById("map-cap").textContent=[D.mapCaption,D.mapTtl].filter(Boolean).join(" · ");
  } else {
    var mp=document.querySelector(".map"); if(mp) mp.style.display="none";
    var ob=document.getElementById("open-btn"); if(ob) ob.style.display="none";
    document.getElementById("map-cap").style.display="none";
  }
  document.getElementById("runit").textContent=isCount?"":D.unit;

  document.getElementById("legend").innerHTML=D.bands.map(function(b){ return '<span><i style="background:'+C[b.cls]+'"></i>'+esc(b.label)+'</span>'; }).join("");
  var stops=[], prev=0;
  D.bands.forEach(function(b){ var to=(b.max===Infinity?D.axisMax:b.max)/D.axisMax*100; stops.push(C[b.cls]+" "+prev+"% "+to+"%"); prev=to; });
  document.getElementById("track").style.background="linear-gradient(90deg,"+stops.join(",")+")";
  document.getElementById("scale").innerHTML="<span>0</span><span>"+Math.round(D.axisMax/4)+"</span><span>"+Math.round(D.axisMax/2)+"</span><span>"+esc(D.axisMax)+"</span>";

  var axis=document.querySelector(".axis");
  D.pois.forEach(function(s){ var p=document.createElement("div"); p.className="pin"; p.style.background=C[s.aux ? "x" : cls(s.d)];
    p.style.left=Math.min(100,s.d/D.axisMax*100)+"%"; p.dataset.d=s.d; axis.appendChild(p); });

  document.getElementById("warn-txt").textContent=D.hedge.warn;
  document.getElementById("hedge-body").textContent=D.hedge.body || "";
  document.getElementById("foot-note").textContent=D.hedge.note||"";
  document.getElementById("source").textContent=D.hedge.source;
  if(D.hedge.verify){ var v=document.getElementById("verify"); v.style.display="inline-flex"; v.href = safeHttpsUrl(D.hedge.verify.url) || "#";
    v.innerHTML='<svg class="ic"><use href="#'+iconId(D.hedge.verify.icon)+'"/></svg>'+esc(D.hedge.verify.label);
    document.getElementById("verify-br").innerHTML="<br>"; }

  var slider=document.getElementById("r"), listEl=document.getElementById("list"), statEl=document.getElementById("stat");
  slider.max=D.axisMax; slider.value=D.radiusDefault;
  function render(r){
    document.getElementById("rval").textContent=r;
    var thr=document.getElementById("thr"); thr.style.left=Math.min(100,r/D.axisMax*100)+"%"; thr.setAttribute("data-r",r+(isCount?"":D.unit));
    var n=0, html="";
    /* s.aux = 참고 항목. 목록·지도에는 보이되 개수(__COUNT__)와 등급 색에는 넣지 않는다.
       개교 예정 학교·종합병원 아닌 병원 등이 등급을 흔들면 안 된다. 최근접 판정은 stat[0] 이 따로 들고 있다. */
    D.pois.forEach(function(s,i){
      var aux = !!s.aux;
      var miss = (s.d===null||s.d===undefined||s.d==="");
      var c = aux ? "x" : cls(s.d);
      var out = !miss && s.d>r;
      if(!out && !miss && !aux) n++;
      html+='<div class="item'+(out?' out':'')+(aux?' aux':'')+'"><span class="nm"><span class="rank">'+(i+1)+'</span>'+esc(s.n)
        + (aux ? '<span class="auxtag">참고</span>' : '') + '</span>'
        +'<span class="d '+c+'"><span class="sdot s-'+c+'"></span>'+esc(fmt(s.d))+'</span></div>'; });
    listEl.innerHTML=html;
    statEl.innerHTML=D.stat.map(function(b){
      var raw = (b.n==="__COUNT__") ? n : b.n;
      var txt = (raw===null||raw===undefined||raw==="") ? "정보없음" : esc(raw);
      var inner=b.dot? '<span class="sdot big s-'+esc(b.dot)+'"></span>'
        : '<span class="'+(b.cls?("s-"+esc(b.cls)):"")+'" style="'+(b.cls?"color:"+C[b.cls]:"")+'">'+txt+'</span>';
      return '<div class="box"><div class="n">'+inner+'</div><div class="l">'+esc(b.l)+'</div></div>'; }).join("");
    document.querySelectorAll(".axis .pin").forEach(function(p){ p.style.opacity=(+p.dataset.d>r)?.28:1; });
  }
  slider.addEventListener("input",function(){ render(+this.value); });
  render(D.radiusDefault);
})();
</script>
</body>
</html>
