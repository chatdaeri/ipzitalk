<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ipzi Talk · 회사 근처 청약공고</title>
<style>
  :root{
    --bg:#e9ebf0; --card:#ffffff; --ink:#14181e; --sub:#5c6673; --sub2:#8a94a2;
    --line:#e7eaef; --line2:#f1f3f7; --chip:#f3f5f9;
    --g:#12a150; --g-s:#e7f6ec; --y:#e0a107; --y-s:#fbf3dd;
    --o:#e56f1f; --o-s:#fbeee2; --x:#9aa4b2; --x-s:#eef1f5;
    --brand:#2f6bff; --brand-s:#e8f0ff;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 14px 36px -16px rgba(16,24,40,.22);
    --mono:"SF Mono",ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0e1116; --card:#161b22; --ink:#eef1f5; --sub:#98a2b0; --sub2:#6b7480;
           --line:#232a33; --line2:#1c222a; --chip:#1c222a;
           --g-s:#12251a; --y-s:#2a2410; --o-s:#2a1c10; --x-s:#1c222a; --brand-s:#16233f;
           --shadow:0 8px 30px rgba(0,0,0,.5); }
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(130% 70% at 50% -5%, color-mix(in srgb,var(--card) 30%,var(--bg)), var(--bg) 55%);
    color:var(--ink);min-height:100vh;
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased;padding:22px 14px;}
  .wrap{max-width:1180px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
  .sdot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle}
  .s-g{background:var(--g)}.s-a{background:var(--y)}.s-o{background:var(--o)}.s-x{background:var(--x)}

  .hero{padding:28px 26px;margin-bottom:16px}
  .eyebrow{font:700 12px/1 var(--mono);color:var(--brand);letter-spacing:.04em}
  .hero h1{margin:12px 0 6px;font-size:26px;font-weight:800;letter-spacing:-.02em}
  .hero p{margin:0;color:var(--sub);font-size:14px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .chip{display:inline-flex;align-items:center;padding:6px 12px;border-radius:999px;background:var(--brand-s);color:var(--brand);font-size:12px;font-weight:700}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .kpi{padding:16px 18px}
  .kpi .l{font-size:12px;color:var(--sub)}
  .kpi .n{font:800 22px/1.3 var(--mono);margin-top:6px}
  .kpi .s{font-size:11.5px;color:var(--sub2);margin-top:2px}

  .panel{padding:22px;margin-bottom:16px}
  .panel h2{margin:0 0 4px;font-size:17px;font-weight:800}
  .panel .desc{color:var(--sub);font-size:13px;margin:0 0 14px}

  .map{position:relative;width:100%;aspect-ratio:16/8;border-radius:12px;overflow:hidden;background:var(--line2);border:1px solid var(--line)}
  .map iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .map-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;background:var(--brand);color:#fff;border-radius:9px;text-decoration:none;font-size:12.5px;font-weight:700}
  .btn:hover{filter:brightness(1.06)}
  .hint{font-size:12.5px;color:var(--sub)}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .item-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--chip)}
  .item-card h3{margin:0 0 4px;font-size:14.5px;font-weight:700;line-height:1.3}
  .item-card .loc{font-size:12px;color:var(--sub);margin-bottom:10px}
  .item-card .stat{display:flex;gap:14px;font:700 13px/1 var(--mono)}
  .item-card .stat span{display:flex;flex-direction:column;gap:4px}
  .item-card .stat small{font:500 10.5px/1 -apple-system,sans-serif;color:var(--sub2)}

  table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th{background:var(--chip);color:var(--sub);text-align:left;font-size:12px;font-weight:700;padding:10px 12px}
  td{border-top:1px solid var(--line2);padding:10px 12px;vertical-align:middle;font-size:13.5px}
  td.merged small{display:block;color:var(--sub2);font-size:11.5px;margin-top:3px;font-weight:500}
  td.detail a{color:var(--brand);font-weight:700;text-decoration:none}

  .unlocated{border:1px solid var(--o);background:var(--o-s);border-radius:12px;padding:14px 16px;font-size:13px;color:var(--ink)}
  .unlocated .t{font-weight:800;color:var(--o);font-size:12.5px;margin-bottom:6px}

  .foot{font-size:12px;color:var(--sub);padding:6px 4px}

  @media(max-width:860px){ .kpis{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>
<div class="wrap">
  <section class="card hero">
    <div class="eyebrow">IPZI TALK</div>
    <h1 id="h-title">–</h1>
    <p id="h-desc">–</p>
    <div class="chips" id="h-chips"></div>
  </section>

  <section class="kpis" id="kpis"></section>

  <section class="card panel" id="map-panel">
    <h2 id="map-title">지도</h2>
    <p class="desc" id="map-desc"></p>
    <div class="map"><iframe id="map-iframe" src="about:blank" title="지도" loading="lazy" sandbox="allow-scripts allow-same-origin" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <div class="map-actions">
      <a class="btn" id="map-open" href="#" target="_blank" rel="noopener">지도 크게 열기 ↗</a>
      <span class="hint" id="map-hint"></span>
    </div>
  </section>

  <section class="card panel" id="unlocated-panel" style="display:none">
    <h2>위치 확인 필요</h2>
    <div id="unlocated-list" style="display:grid;gap:10px"></div>
  </section>

  <section class="card panel">
    <h2 id="cards-title">거리순 후보</h2>
    <div class="cards" id="cards"></div>
  </section>

  <section class="card panel">
    <h2 id="table-title">주택형 비교표</h2>
    <p class="desc" id="table-desc">같은 공고는 단지/위치 셀을 병합했습니다.</p>
    <table>
      <thead><tr><th>단지/공고</th><th>위치</th><th>주택형</th><th>최고 분양가</th><th>공급세대</th><th>원문</th></tr></thead>
      <tbody id="table-body"></tbody>
    </table>
    <p class="desc" id="price-note" style="margin:8px 0 0"></p>
  </section>

  <p class="foot" id="foot-note"></p>
  <p class="foot" id="source-note" style="margin-top:2px"></p>
</div>

<script type="application/json" id="ipzi-data">{}</script>
<script>
const templateDataShape = {
  title: "",
  desc: "",
  chips: [],
  kpis: [],
  mapUrl: null,
  mapTitle: "지도",
  mapDesc: "",
  mapHint: "",
  unlocated: [],
  cardsTitle: "거리순 후보",
  listings: [],
  tableTitle: "주택형 비교표",
  priceNote: "표시된 금액은 주택형별 최고가 기준입니다. 평균가·최저가와 다를 수 있습니다.",
  footNote: "자료 기준 · 확인 필요: 이 화면은 청약 의사결정을 돕기 위한 요약입니다. 실제 청약 전 모집공고문과 청약홈 원문을 반드시 확인하세요.",
  sourceNote: "데이터 출처: 청약홈 분양정보 · 청약홈 주택형별 분양정보"
};
const parsedTemplateData = JSON.parse(document.getElementById("ipzi-data").textContent);
const templateData = Object.keys(parsedTemplateData).length ? parsedTemplateData : templateDataShape;

(function(){
  function safeHttpsUrl(value){
    try {
      var url = new URL(String(value == null ? "" : value));
      if(url.protocol !== "https:") return null;
      return url.href;
    } catch (_) { return null; }
  }
  function safeMapUrl(value){
    var safe = safeHttpsUrl(value);
    if(!safe) return null;
    var url = new URL(safe);
    if(url.origin !== "https://ipzi-talk.synergylabs.kr") return null;
    if(url.username || url.password) return null;
    if(url.pathname !== "/map") return null;
    if(!url.searchParams.get("d")) return null;
    if(url.searchParams.getAll("d").length !== 1) return null;
    if(Array.from(url.searchParams.keys()).some(function(key){ return key !== "d"; })) return null;
    if(url.hash) return null;
    return url.href;
  }
  var D = templateData, NA = "정보없음";
  function esc(v){ return String(v == null ? "" : v).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
  function na(v){ return (v === null || v === undefined || v === "") ? NA : esc(v); }
  document.getElementById("h-title").textContent = D.title || "–";
  document.getElementById("h-desc").textContent = D.desc || "";
  document.getElementById("h-chips").innerHTML = (D.chips||[]).map(function(c){ return '<span class="chip">'+esc(c)+'</span>'; }).join("");

  document.getElementById("kpis").innerHTML = (D.kpis||[]).map(function(k){
    return '<div class="card kpi"><div class="l">'+esc(k.label)+'</div><div class="n">'+na(k.value)+'</div>'
      + (k.sub? '<div class="s">'+esc(k.sub)+'</div>' : '') + '</div>';
  }).join("");

  var mapPanel = document.getElementById("map-panel");
  if(D.mapUrl){
    document.getElementById("map-title").textContent = D.mapTitle || "지도";
    document.getElementById("map-desc").textContent = D.mapDesc || "";
    document.getElementById("map-iframe").src = safeMapUrl(D.mapUrl) || "about:blank";
    document.getElementById("map-open").href = safeMapUrl(D.mapUrl) || "#";
    document.getElementById("map-hint").textContent = D.mapHint || "";
  } else {
    mapPanel.style.display = "none";
  }

  if(D.unlocated && D.unlocated.length){
    document.getElementById("unlocated-panel").style.display = "";
    document.getElementById("unlocated-list").innerHTML = D.unlocated.map(function(u){
      return '<div class="unlocated"><div class="t">'+esc(u.name)+'</div>'+esc(u.reason||"공고문 원문 확인 필요")+'</div>';
    }).join("");
  }

  document.getElementById("cards-title").textContent = D.cardsTitle || "거리순 후보";
  document.getElementById("cards").innerHTML = (D.listings||[]).map(function(l){
    return '<div class="item-card"><h3>'+esc(l.name)+'</h3><div class="loc">'+esc(l.locationLabel)+'</div>'
      + '<div class="stat"><span>'+na(l.maxPriceLabel)+'<small>최고가</small></span><span>'+na(l.supplyCount)+'<small>공급</small></span></div></div>';
  }).join("");

  document.getElementById("table-title").textContent = D.tableTitle || "주택형 비교표";
  var rows = "";
  (D.listings||[]).forEach(function(l){
    var units = l.units || [];
    units.forEach(function(u, i){
      rows += "<tr>";
      if(i===0){
        rows += '<td class="merged" rowspan="'+units.length+'"><b>'+esc(l.name)+'</b>'+(l.dateStr? '<small>'+esc(l.dateStr)+'</small>':'')+'</td>';
        rows += '<td class="merged" rowspan="'+units.length+'"><b>'+esc(l.locationLabel)+'</b>'
          + (l.addressDetail? '<small>'+esc(l.addressDetail)+'</small>':'')
          + (l.distanceLabel? '<small>'+esc(l.distanceLabel)+'</small>':'') + '</td>';
      }
      rows += '<td>'+na(u.type)+'</td><td>'+na(u.maxPrice)+'</td><td>'+na(u.supply)+'</td>';
      if(i===0){
        rows += '<td class="detail" rowspan="'+units.length+'">'
          + (l.detailUrl? '<a target="_blank" rel="noopener" href="'+esc(safeHttpsUrl(l.detailUrl)||"#")+'">공고문 보기</a>' : '공고문 원문 확인 필요')
          + '</td>';
      }
      rows += "</tr>";
    });
  });
  document.getElementById("table-body").innerHTML = rows;

  document.getElementById("price-note").textContent = D.priceNote || "";
  document.getElementById("foot-note").textContent = D.footNote || "";
  document.getElementById("source-note").textContent = D.sourceNote || "";
})();
</script>
</body>
</html>
