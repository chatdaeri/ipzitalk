<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>주차 랭킹</title>
<style>
:root{--bg:#e9ebf0;--card:#fff;--ink:#14181e;--sub:#5c6673;--sub2:#8a94a2;--line:#e7eaef;--line2:#f1f3f7;--chip:#f3f5f9;--g:#12a150;--gs:#e7f6ec;--y:#e0a107;--ys:#fbf3dd;--o:#e56f1f;--os:#fbeee2;--x:#9aa4b2;--xs:#eef1f5;--brand:#2f6bff;--bs:#e8f0ff;--r:#e5484d;--rs:#fbe9ea;--shadow:0 1px 2px rgba(16,24,40,.05),0 14px 36px -16px rgba(16,24,40,.22);--mono:"SF Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#161b22;--ink:#eef1f5;--sub:#98a2b0;--sub2:#6b7480;--line:#232a33;--line2:#1c222a;--chip:#1c222a;--gs:#12251a;--ys:#2a2410;--os:#2a1c10;--xs:#1c222a;--bs:#16233f;--rs:#30181b;--shadow:0 8px 30px rgba(0,0,0,.5)}}
:root[data-theme="light"]{--bg:#e9ebf0;--card:#fff;--ink:#14181e;--sub:#5c6673;--line:#e7eaef;--line2:#f1f3f7;--chip:#f3f5f9;--gs:#e7f6ec;--ys:#fbf3dd;--os:#fbeee2;--xs:#eef1f5;--bs:#e8f0ff;--rs:#fbe9ea}
:root[data-theme="dark"]{--bg:#0e1116;--card:#161b22;--ink:#eef1f5;--sub:#98a2b0;--sub2:#6b7480;--line:#232a33;--line2:#1c222a;--chip:#1c222a;--gs:#12251a;--ys:#2a2410;--os:#2a1c10;--xs:#1c222a;--bs:#16233f;--rs:#30181b;--shadow:0 8px 30px rgba(0,0,0,.5)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(120% 75% at 50% -5%,color-mix(in srgb,var(--card) 36%,var(--bg)),var(--bg) 56%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5;padding:26px 16px}.wrap{max-width:1180px;margin:0 auto}.top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;margin-bottom:16px}.kicker{font:700 12px/1 var(--mono);letter-spacing:.04em;color:var(--brand);margin-bottom:10px}.title{display:flex;align-items:center;gap:10px;margin:8px 0 4px;font-size:28px;letter-spacing:-.04em;line-height:1.15}.subtitle{margin:0;color:var(--sub);font-size:14px}.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;font:800 12px/1 var(--mono);white-space:nowrap}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--brand)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.pad{padding:18px 20px}.grid{display:grid;gap:14px}.g2{grid-template-columns:1.1fr .9fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}@media(max-width:860px){.top,.g2,.g3,.g4{grid-template-columns:1fr;display:block}.card{margin-bottom:14px}.title{font-size:22px}}
.metric{border:1px solid var(--line);background:var(--chip);border-radius:14px;padding:14px}.metric .n{font:850 24px/1 var(--mono);letter-spacing:-.04em}.metric .l{margin-top:7px;color:var(--sub);font-size:12px}.section-title{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:850;margin:0 0 12px;letter-spacing:-.02em}.section-title svg{color:var(--brand)}.table{width:100%;border-collapse:collapse;font-size:13.5px}.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}.table th{color:var(--sub);font-weight:700;width:31%}.rank{display:grid;gap:9px}.top3{display:grid;gap:8px;margin-top:16px}.top3 .t{display:grid;grid-template-columns:30px minmax(120px,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:10px}.top3 .t.site{border-color:var(--brand);background:linear-gradient(90deg,rgba(37,99,235,.10),var(--card))}.top3 .t .r{font:800 12px/1 var(--mono);color:var(--sub2);text-align:center}.top3 .t.site .r,.top3 .t.site .nm{color:var(--brand)}.top3 .t .nm{font-weight:800;font-size:13px}.top3 .t .mt{color:var(--sub);font-size:11px;margin-top:2px}.top3 .t .v{font:800 13px/1 var(--mono);text-align:right;white-space:nowrap}.sub-title{font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.02em;margin:16px 0 0}.row{display:grid;grid-template-columns:42px minmax(160px,1fr) 110px 90px;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}.row.site{border-color:var(--brand);background:linear-gradient(90deg,rgba(37,99,235,.12),var(--card));box-shadow:0 0 0 2px rgba(37,99,235,.10)}.row.site .r,.row.site .name{color:var(--brand)}.row .r{font:800 12px/1 var(--mono);color:var(--sub2)}.row .name{font-weight:800}.row .meta{color:var(--sub);font-size:12px}.bar{height:9px;border-radius:99px;background:var(--line2);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:var(--brand)}.val{font:800 13px/1 var(--mono);text-align:right}.badge{display:inline-block;border-radius:999px;padding:5px 8px;font:800 11px/1 var(--mono)}.green{background:var(--gs);color:var(--g)}.amber{background:var(--ys);color:var(--y)}.orange{background:var(--os);color:var(--o)}.gray{background:var(--xs);color:var(--x)}.blue{background:rgba(37,99,235,.12);color:var(--brand)}.red{background:var(--rs);color:var(--r)}.map{height:390px;background:var(--line2);overflow-x:auto;overflow-y:hidden}.map iframe{display:block;width:100%;min-width:720px;height:100%;border:0}.note{font-size:12px;color:var(--sub);border-top:1px solid var(--line);padding-top:12px;margin-top:14px}.warn{display:inline-flex;gap:6px;align-items:center;color:var(--o);background:var(--os);font:700 11px/1.4 var(--mono);padding:6px 9px;border-radius:8px;margin-bottom:8px}.exlist{display:grid;gap:8px;margin-top:10px}.exlist .row{display:grid;grid-template-columns:minmax(96px,auto) 1fr;gap:12px;align-items:baseline;padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-size:12.5px;color:var(--sub)}.exlist .nm{font-weight:800;color:var(--ink)}.footlink{color:var(--brand);text-decoration:none;font-weight:800}.small{font-size:12px;color:var(--sub)}
svg.ic{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.18em}
.src{font-size:10.5px;color:var(--sub2);margin:6px 0 0;text-align:right;letter-spacing:-.01em}
</style>
</head>
<body>
<!--
  아이콘 스프라이트 — 인라인 self-contained. <use href="#i-…">는 같은 문서의 <symbol>만 참조한다.
  [주의] 심볼을 임의로 지우지 말 것. 일부 심볼은 마크업이 아니라 아래 ipzi-data/렌더 JS의
  아이콘 문자열로만 참조된다. "안 쓰는 심볼"로 보고 지우면 아이콘이 에러 없이 조용히 사라진다.
  이 블록과 아래 ICONS 배열은 항상 함께 고친다.
-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-map" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"></path><path d="M9 4v14M15 6v14"></path></g></symbol>
<symbol id="i-parking" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3.5"></rect><path d="M9.5 16.5V7.5h3.6a2.7 2.7 0 0 1 0 5.4H9.5"></path></g></symbol>
<symbol id="i-sample" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 7 20M17 4l-2 16M4 9.5h16M3 15h16"></path></g></symbol>
</svg>

<div class="wrap">
  <div class="top">
    <div>
      <div class="kicker" id="brand">IPZI TALK</div>
      <h1 class="title"><svg class="ic" style="color:var(--brand)"><use href="#i-parking"/></svg><span id="title">–</span></h1>
      <p class="subtitle" id="subtitle"></p>
    </div>
    <div class="pill" id="pill" style="display:none"><span class="dot"></span><span id="pill-label"></span></div>
  </div>

  <div class="grid g2">
    <div class="card"><div class="pad">
      <h2 class="section-title"><svg class="ic"><use href="#i-parking"/></svg><span id="rank-title">세대당 주차 랭킹</span></h2>
      <div class="rank" id="rank"></div>
      <p class="src">세대수·주차 — 공동주택관리정보시스템(K-apt) · 위치 — 카카오맵</p>
    </div></div>
    <div class="card"><div class="pad">
      <h2 class="section-title"><svg class="ic" style="color:var(--sub)"><use href="#i-map"/></svg><span id="summary-title">기준 단지 위치</span></h2>
      <div class="grid g4" id="summary-metrics"></div>
      <h3 class="sub-title" id="top3-title" style="display:none"></h3>
      <div class="top3" id="top3"></div>
      <p class="small" id="summary-note"></p>
      <p class="src">세대수·주차 — 공동주택관리정보시스템(K-apt) · 위치 — 카카오맵</p>
    </div></div>
  </div>

  <div class="card" id="map-card" style="margin-top:14px;display:none"><div class="map"><iframe id="map-iframe" src="about:blank" title="지도" loading="lazy" sandbox="allow-scripts allow-same-origin" referrerpolicy="strict-origin-when-cross-origin"></iframe></div><div class="pad"><p class="src">네이버 지도 · 카카오맵</p></div></div>
  <p class="small" id="map-cap" style="margin:8px 2px 0;display:none"></p>

  <!-- 표본 범위·제외 단지는 별도 카드. 예전엔 푸터의 유의사항·출처와 <br> 로 이어붙어
       "무엇이 빠졌는가"가 잡문에 묻혔다. 표본에서 빠진 단지는 사용자의 판단을 바꾸는 정보다. -->
  <div class="card" id="scope-card" style="margin-top:14px;display:none"><div class="pad">
    <h2 class="section-title"><svg class="ic" style="color:var(--sub)"><use href="#i-sample"/></svg><span>표본 범위 · 제외 단지</span></h2>
    <div class="warn" id="scope-note" style="display:none"></div>
    <div class="exlist" id="excluded-list"></div>
    <p class="src">공동주택관리정보시스템(K-apt)</p>
  </div></div>

  <div class="note" id="note"></div>
</div>

<script type="application/json" id="ipzi-data">{}</script>
<script>
/* 이 템플릿은 고정이다. 실행마다 바뀌는 것은 아래 templateData 블록 하나뿐이다.
   - 세대당 주차 결측(값 없음)은 0이 아니라 "정보없음"이다. 결측 단지는 rows 에서 빼고 excluded 에 사유를 남긴다.
   - 표본이 전수가 아니면 sampleNote 를 항상 싣는다.
   - map.url 이 null 이면 지도 패널이 통째로 숨는다. */
const templateDataShape = {
  brand: "IPZI TALK",
  title: "",                 // "주차 랭킹"
  subtitle: "",              // "기준 단지 반경 2km · 세대당 주차대수 기준"
  pill: "",                  // "2km 표본"

  map: {
    url: null,               // 지도 링크. null 이면 지도 패널 숨김
    caption: "",             // 마커·반경 설명
    ttlNote: "지도 링크는 발급 후 7일간 유효합니다. 만료되면 지도가 빈 화면으로 뜨므로 재발급이 필요합니다."
  },

  rankTitle: "",             // "세대당 주차 랭킹"
  rows: [],                  // [{name, isSite:false, badges:[{label,tone}], meta:"거리 · 연도 · 세대수", value:1.57, valLabel:"1.57대/세대"}]
                             //   value = 정렬/막대용 숫자. 결측 단지는 rows 에 넣지 말고 excluded 로.

  summary: {                 // 기준 단지 요약 카드
    title: "",               // "기준 단지 위치"
    metrics: [],             // [{n:"#2", l:"표본 내 순위"}]
    note: ""                 // 한 줄 설명 (정성 우열 단정 금지)
  },

  sampleNote: "",            // "데모용 표본 · 전수 랭킹 아님"
  excluded: [],              // [{name, reason:"주차 대수 자료없음 — 0으로 간주 금지"}]
  hedges: [],                // ["세대당 주차는 등록값 기준. 기계식/상가/공유 주차 여부는 별도 확인 전 미반영."]
  sources: [],               // ["카카오맵", "네이버 지도"]
  collectedAt: ""            // "YYYY-MM-DD"
};
const parsedTemplateData = JSON.parse(document.getElementById("ipzi-data").textContent);
const templateData = Object.keys(parsedTemplateData).length ? parsedTemplateData : templateDataShape;

(function(){
  var D = templateData || {}, NA = "정보없음";
  function esc(v){ return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  /* esc() 는 스킴을 막지 못한다. `javascript:alert(1)` 은 따옴표가 없어 그대로 href 에 들어간다.
     일반 링크는 https만 허용하고, 지도 iframe은 Ipzi Talk 정식 /map?d=<id> URL만 허용한다. */
  function safeHttpsUrl(value){
    try {
      var url = new URL(String(value == null ? "" : value));
      if(url.protocol !== "https:") return null;
      return url.href;
    } catch (_) { return null; }
  }
  function safeMapUrl(value){
    var safe = safeHttpsUrl(value);
    if(!safe) return null;
    var url = new URL(safe);
    if(url.origin !== "https://ipzi-talk.synergylabs.kr") return null;
    if(url.username || url.password) return null;
    if(url.pathname !== "/map") return null;
    if(!url.searchParams.get("d")) return null;
    if(url.searchParams.getAll("d").length !== 1) return null;
    if(Array.from(url.searchParams.keys()).some(function(key){ return key !== "d"; })) return null;
    if(url.hash) return null;
    return url.href;
  }
  /* 스프라이트에 실재하는 심볼만 허용. 없는 id 를 <use> 로 가리키면 브라우저는 조용히 빈 자리를 그린다.
     심볼을 추가/삭제하면 위 sprite 블록과 이 배열을 함께 고칠 것. */
  var ICONS = ["i-map","i-parking","i-sample"];
  function icon(id,tone){
    if(!id) return "";
    if(ICONS.indexOf(id)===-1){ console.warn('[result.html] 스프라이트에 없는 아이콘 id: "'+id+'" — 생략합니다.'); return ""; }
    var c = tone ? ' style="color:var(--'+esc(tone)+')"' : "";
    return '<svg class="ic"'+c+'><use href="#'+esc(id)+'"/></svg>';
  }
  function badges(list){ return (list||[]).map(function(b){ return ' <span class="badge '+esc(b.tone||"gray")+'">'+esc(b.label)+'</span>'; }).join(""); }
  function set(id,txt){ var e=document.getElementById(id); if(e) e.textContent = (txt==null?"":txt); }

  set("brand", D.brand||"IPZI TALK");
  set("title", D.title||"–");
  set("subtitle", D.subtitle);
  if(D.pill){ document.getElementById("pill").style.display=""; set("pill-label", D.pill); }
  if(D.rankTitle) set("rank-title", D.rankTitle);

  var rows = D.rows || [];
  var vals = rows.map(function(r){ return typeof r.value==="number" ? r.value : null; }).filter(function(v){ return v!=null; });
  var max = vals.length ? Math.max.apply(null, vals) : 0;
  var rankEl = document.getElementById("rank");
  if(!rows.length){
    rankEl.innerHTML = '<div class="small">해당 반경 내 랭킹 대상 단지가 없습니다.</div>';
  } else {
    rankEl.innerHTML = rows.map(function(r,i){
      var pct = (max>0 && typeof r.value==="number") ? Math.max(0,Math.min(100, r.value/max*100)).toFixed(1) : 0;
      return '<div class="row'+(r.isSite?" site":"")+'">'
        + '<div class="r">#'+(i+1)+'</div>'
        + '<div><div class="name">'+esc(r.name)+badges(r.badges)+'</div><div class="meta">'+esc(r.meta)+'</div></div>'
        + '<div class="bar"><i style="width:'+pct+'%"></i></div>'
        + '<div class="val">'+(r.valLabel?esc(r.valLabel):NA)+'</div>'
        + '</div>';
    }).join("");
  }

  var sm = D.summary || {};
  if(sm.title) set("summary-title", sm.title);
  document.getElementById("summary-metrics").innerHTML = (sm.metrics||[]).map(function(m){
    return '<div class="metric"><div class="n">'+esc(m.n)+'</div><div class="l">'+esc(m.l)+'</div></div>';
  }).join("");
  /* 상위 3개는 D.rows 에서 직접 뽑는다. 별도 데이터 필드를 두면 왼쪽 랭킹 표와 숫자가 어긋난다.
     (실제로 목록은 5곳인데 본문이 6곳이라고 적힌 적이 있다.) */
  var top3 = rows.slice(0, 3);
  if(top3.length){
    var t3 = document.getElementById("top3-title");
    t3.style.display=""; t3.textContent = "세대당 주차 상위 " + top3.length + "개 단지";
    document.getElementById("top3").innerHTML = top3.map(function(r,i){
      return '<div class="t'+(r.isSite?" site":"")+'">'
        + '<div class="r">#'+(i+1)+'</div>'
        + '<div><div class="nm">'+esc(r.name)+badges(r.badges)+'</div><div class="mt">'+esc(r.meta)+'</div></div>'
        + '<div class="v">'+(r.valLabel?esc(r.valLabel):NA)+'</div>'
        + '</div>';
    }).join("");
  }
  set("summary-note", sm.note);

  if(D.map && D.map.url){
    document.getElementById("map-card").style.display="";
    document.getElementById("map-iframe").src = safeMapUrl(D.map.url) || "about:blank";
    var cap = [D.map.caption, D.map.ttlNote].filter(Boolean);
    if(cap.length){
      var mc = document.getElementById("map-cap");
      mc.innerHTML = esc(cap[0]) + (cap[1] ? '<br><strong>'+esc(cap[1])+'</strong>' : "");
      mc.style.display="";
    }
  }

  /* 표본 범위와 제외 단지는 푸터가 아니라 자기 카드에 둔다.
     "반경 내 후보 N개 중 M개만 봤다" 와 "이 단지는 왜 빠졌다" 는 결론을 바꾸는 정보다.
     <br> 로 유의사항·출처와 이어붙이면 잡문에 묻힌다. */
  var ex = D.excluded || [];
  if(D.sampleNote || ex.length){
    document.getElementById("scope-card").style.display = "";
    if(D.sampleNote){
      var sn = document.getElementById("scope-note");
      sn.style.display = ""; sn.innerHTML = icon("i-sample") + esc(D.sampleNote);
    }
    document.getElementById("excluded-list").innerHTML = ex.map(function(e){
      return '<div class="row"><span class="nm">' + esc(e.name) + '</span><span>' + esc(e.reason) + '</span></div>';
    }).join("");
  }

  var n = "";
  (D.hedges||[]).forEach(function(h,i){ n += (i?'<br>':'')+esc(h); });
  var src = (n ? '<br>' : '') + '데이터: <a class="footlink" href="https://www.k-apt.go.kr/web/main/index.do" target="_blank" rel="noopener">공동주택관리정보시스템(K-apt)</a>';
  (D.sources||[]).forEach(function(s){ src += ' · '+esc(s); });
  if(D.collectedAt) src += ' · 기준일 '+esc(D.collectedAt);
  document.getElementById("note").innerHTML = n + src;
})();
</script>
</body>
</html>
