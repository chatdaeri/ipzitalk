<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>실거래 추이 분석</title>
<style>
  :root{
    --bg:#e9ebf0; --card:#ffffff; --ink:#14181e; --sub:#5c6673; --sub2:#8a94a2;
    --line:#e7eaef; --line2:#f1f3f7; --chip:#f3f5f9; --zebra:#fafbfc;
    --g:#12a150; --g-s:#e7f6ec; --y:#e0a107; --y-s:#fbf3dd; --o:#e56f1f; --o-s:#fbeee2;
    --r:#e5484d; --r-s:#fbeaeb; --x:#9aa4b2; --x-s:#eef1f5;
    --up:#e5484d; --up-s:#fbeaeb; --down:#2f6bff; --down-s:#e8f0ff;
    --brand:#2f6bff; --brand-s:#e8f0ff;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 14px 36px -16px rgba(16,24,40,.22);
    --mono:"SF Mono",ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0c0f14; --card:#161b22; --ink:#e8ecf2; --sub:#9aa4b2; --sub2:#6b7684;
      --line:#2a313d; --line2:#1b212a; --chip:#1e242e; --zebra:#181d25;
      --g:#38cf7a; --g-s:#0f2a1d; --y:#e8b53f; --y-s:#2b2410; --o:#f0813e; --o-s:#2c1d12;
      --r:#f05a5f; --r-s:#301619; --x:#8b95a3; --x-s:#212832;
      --up:#f05a5f; --up-s:#301619; --down:#5b8bff; --down-s:#17233d; --brand:#5b8bff; --brand-s:#17233d;
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 20px 46px -18px rgba(0,0,0,.75); }
  }
  :root[data-theme="light"]{ --bg:#e9ebf0; --card:#fff; --ink:#14181e; --sub:#5c6673; --sub2:#8a94a2; --line:#e7eaef; --line2:#f1f3f7; --chip:#f3f5f9; --zebra:#fafbfc; --g:#12a150; --y:#e0a107; --o:#e56f1f; --r:#e5484d; --x:#9aa4b2; --x-s:#eef1f5; --up:#e5484d; --down:#2f6bff; --brand:#2f6bff; --brand-s:#e8f0ff; }
  :root[data-theme="dark"]{ --bg:#0c0f14; --card:#161b22; --ink:#e8ecf2; --sub:#9aa4b2; --sub2:#6b7684; --line:#2a313d; --line2:#1b212a; --chip:#1e242e; --zebra:#181d25; --g:#38cf7a; --y:#e8b53f; --o:#f0813e; --r:#f05a5f; --x:#8b95a3; --x-s:#212832; --up:#f05a5f; --down:#5b8bff; --brand:#5b8bff; --brand-s:#17233d; }

  *{box-sizing:border-box}
  body{margin:0;padding:28px 18px 40px;background:var(--bg);color:var(--ink);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:860px;margin:0 auto}
  .ic{width:18px;height:18px;flex:none}

  header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
  .kicker{font:800 11px/1 var(--mono);letter-spacing:.14em;color:var(--brand);margin-bottom:9px}
  h1{display:flex;align-items:center;gap:10px;margin:0;font-size:26px;font-weight:850;letter-spacing:-.03em}
  .subtitle{margin:7px 0 0;color:var(--sub);font-size:13px}
  .pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:8px 13px;
    font:800 12px/1 var(--mono);background:var(--chip);color:var(--sub)}
  .pill .sdot{width:9px;height:9px;border-radius:50%;flex:none}
  .s-g{background:var(--g)} .s-a{background:var(--y)} .s-o{background:var(--o)} .s-x{background:var(--x)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px;margin-bottom:14px}
  h2{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:850;margin:0 0 12px;letter-spacing:-.02em}
  h2 svg{color:var(--brand)}
  .desc{margin:0 0 14px;color:var(--sub);font-size:12.5px}

  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media(max-width:720px){ .grid4{grid-template-columns:repeat(2,1fr)} }
  .metric{border:1px solid var(--line);background:var(--chip);border-radius:14px;padding:14px}
  .metric .n{font:850 22px/1 var(--mono);letter-spacing:-.04em}
  .metric .l{margin-top:7px;color:var(--sub);font-size:11.5px}
  .metric .n.up{color:var(--up)} .metric .n.down{color:var(--down)} .metric .n.flat{color:var(--sub)}

  /* 타입군 결정 근거. 어떤 전용면적을 골랐는지 사용자가 모르면 숫자를 믿을 수 없다. */
  .callout{border:1px solid var(--line);background:var(--zebra);border-radius:12px;padding:13px 15px;margin-bottom:14px}
  .callout h3{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:13px;font-weight:800}
  .callout h3 svg{color:var(--sub)}
  .callout p{margin:0;color:var(--sub);font-size:12.5px}

  /* 차트가 카드 폭에 짓눌리면 라벨이 겹친다. 좁은 화면에서는 가로 스크롤로 넘긴다. */
  .chartbox{overflow-x:auto;overflow-y:hidden}
  .chartbox > svg{display:block;min-width:660px;width:100%;height:auto}
  .legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:11.5px;color:var(--sub)}
  .legend .li{display:inline-flex;align-items:center;gap:6px}
  .legend .sw{width:20px;height:3px;border-radius:2px;flex:none}
  /* 대시 패턴이 곧 의미다. 5 4 = 대조선(다른 계열) · 2 3 = 기간 평균(같은 계열의 요약).
     둘을 섞어 쓰면 "다른 평형대 실거래"와 "평균값"이 같은 그림이 된다. */
  .legend .sw.cmp{background:repeating-linear-gradient(90deg,var(--x) 0 5px,transparent 5px 9px);height:2px}
  .legend .sw.avg{background:repeating-linear-gradient(90deg,var(--brand) 0 2px,transparent 2px 5px);height:2px}
  .legend .sw.ma{background:var(--brand);opacity:.35}
  .legend .dot{width:9px;height:9px;border-radius:50%;flex:none;border:2px solid var(--brand)}
  .legend .dot.solid{background:var(--brand)}
  .legend .dot.prov{border-color:var(--o)}
  .legend .band{width:16px;height:11px;border-radius:3px;background:var(--x-s);border:1px solid var(--line);flex:none}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 8px;border-bottom:1px solid var(--line2);text-align:left}
  th{color:var(--sub);font-weight:700;font-size:12px}
  td.num,th.num{text-align:right;font-family:var(--mono)}
  tbody tr:nth-child(odd){background:var(--zebra)}
  .tag{display:inline-block;border-radius:999px;padding:3px 7px;font:800 10px/1.3 var(--mono)}
  .tag.hold{background:var(--x-s);color:var(--x)} .tag.thin{background:var(--y-s);color:var(--y)}
  .tag.prov{background:var(--o-s);color:var(--o)}
  .muted{color:var(--sub2)}

  .exlist{display:grid;gap:8px}
  .exlist .row{display:grid;grid-template-columns:86px 1fr;gap:10px;align-items:baseline;
    padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-size:12.5px}
  .exlist .ym{font:800 12px/1 var(--mono);color:var(--sub)}

  .note{font-size:12px;color:var(--sub);border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
  .note ul{margin:8px 0 0;padding-left:18px} .note li{margin:3px 0}
  .footlink{color:var(--brand);text-decoration:none;font-weight:800}
  .src{font-size:10.5px;color:var(--sub2);margin:6px 0 0;text-align:right;letter-spacing:-.01em}
</style>
</head>
<body>

<!--
  아이콘 스프라이트 — 인라인이어야 한다. 산출물은 사용자가 혼자 여는 단일 HTML이라
  옆에 sprite.svg 를 둬도, CDN 도 따라가지 않는다.
  [주의] 아래 ICONS 배열과 이 블록은 항상 같이 고친다. 심볼을 지우면 아이콘이 조용히 사라진다.
--><svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-trend" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 6-7"/><path d="M15 9h4v4"/></g></symbol>
<symbol id="i-won" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7l3 10 3-7 3 7 3-10"/><path d="M3 11h18"/></g></symbol>
<symbol id="i-sample" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9"/><path d="M10 19V5"/><path d="M16 19v-7"/><path d="M3 21h18"/></g></symbol>
<symbol id="i-calendar2" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></g></symbol>
<symbol id="i-area" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 3v18M3 8h18"/></g></symbol>
<symbol id="i-info" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></g></symbol>
<symbol id="i-source" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></g></symbol>
</svg>

<div class="wrap">
  <header>
    <div>
      <div class="kicker" id="brand">IPZI TALK</div>
      <h1><svg class="ic" style="color:var(--brand)"><use id="ttl-ic" href="#i-trend"/></svg><span id="title">실거래 추이 분석</span></h1>
      <p class="subtitle" id="subtitle"></p>
    </div>
    <div class="pill" id="pill" style="display:none"><span class="sdot" id="pill-dot"></span><span id="pill-label"></span></div>
  </header>

  <section class="card">
    <div class="grid4" id="kpis"></div>
    <p class="src">국토교통부 실거래가</p>
  </section>

  <section class="card">
    <h2><svg class="ic"><use href="#i-trend"/></svg><span id="chart-title">월별 실거래 중위 평당가 추이</span></h2>
    <!-- 어떤 전용면적을 골랐는지 밝히지 않으면 그래프의 숫자를 믿을 근거가 없다. -->
    <div class="callout" id="area-callout" style="display:none">
      <h3><svg class="ic"><use href="#i-area"/></svg><span id="area-title">전용타입 고정</span></h3>
      <p id="area-body"></p>
    </div>
    <div class="chartbox"><svg id="chart" viewBox="0 0 720 300" role="img" aria-label="월별 실거래 중위 평당가 추이"></svg></div>
    <div class="legend" id="legend"></div>
    <p class="src">국토교통부 실거래가</p>
  </section>

  <section class="card">
    <h2><svg class="ic" style="color:var(--sub)"><use href="#i-won"/></svg><span id="table-title">월별 실거래 상세</span></h2>
    <p class="desc" id="table-desc"></p>
    <table>
      <thead><tr>
        <th>기준월</th><th class="num">거래 건수</th><th class="num">중위 평당가</th><th class="num">중위 거래가</th><th>비고</th>
      </tr></thead>
      <tbody id="table-body"></tbody>
    </table>
    <p class="src">국토교통부 실거래가</p>
  </section>

  <section class="card" id="ex-panel" style="display:none">
    <h2><svg class="ic" style="color:var(--sub)"><use href="#i-info"/></svg><span id="ex-title">제외·유보한 달</span></h2>
    <div class="exlist" id="ex-list"></div>
  </section>

  <section class="card">
    <h2><svg class="ic" style="color:var(--sub)"><use href="#i-source"/></svg>유의사항 · 출처</h2>
    <div class="note">
      <ul id="hedges"></ul>
      <p id="sources" style="margin-top:12px"></p>
    </div>
  </section>
</div>

<script type="application/json" id="ipzi-data">{}</script>
<script>
/* ────────────────────────────────────────────────────────────────
   여기만 채운다. 마크업·CSS·위 렌더 JS 는 고정이다.
   - 값이 없으면 null. 0 으로 채우지 않는다. 거래 없는 달은 pyeong/price = null, n = 0.
   - series 와 table 의 기준월·건수는 서로 어긋나면 안 된다.
   - avgPyeong 은 결측월을 뺀 평균이다. 0 을 섞어 계산하지 말 것.

   아래 다섯 가지는 모두 선택이다. 없으면 해당 레이어를 통째로 그리지 않는다.
   있는 척 그리는 것보다 없는 게 낫다.
     compareSeries      다른 전용타입을 섞은 대조선. 단일 평형 단지면 넣지 말 것
     avgPyeongCompare   대조선의 기간 평균
     provisionalFrom    이 달부터 신고지연(확정 아님). 세로 경계선 + 속 빈 주황 점
     annotateExtremes   확정창 안에서 고점·저점에 라벨. 기본 켜짐
     extremesMinSample  극점 후보의 최소 표본. 기본 = normalSampleFrom(8)

   표본 문턱은 둘이다. 하나로 합치면 규칙이 깨진다.
     thinSampleUnder   4  미만 = 판정 유보 (속 빈 점 · 표에 `판정 유보`)
     normalSampleFrom  8  미만 = 참고용 (표에 `표본 부족`) · 이상 = 정상
   고점·저점은 **정상 표본에서만** 찾는다. 4건짜리 달이 7건짜리를 0.15% 차이로 이겨
   고점이 된 실측이 있다. 그래서 표본이 얇은 단지는 후보가 2개 미만이 되어
   극점 라벨이 아예 생략된다. 그게 맞다 — 없는 확신을 그리지 않는다.
   ──────────────────────────────────────────────────────────────── */
const templateDataShape = {
  brand: "IPZI TALK",
  title: "실거래 추이 분석",
  subtitle: "",
  iconId: "i-trend",
  pill: null,

  chartTitle: "월별 실거래 중위 평당가 추이",
  areaTitle: "전용타입 고정",
  areaNote: "",

  kpis: [],

  series: [],
  avgPyeong: null,
  avgLabel: "타입군 평균",
  maWindow: 3,
  thinSampleUnder: 4,           // 미만 = 판정 유보
  normalSampleFrom: 8,          // 미만 = 표본 부족(참고용) · 이상 = 정상

  // 선택 — 없으면 레이어 생략
  compareSeries: null,          // [{ym, pyeong}] · series 와 같은 달·같은 순서
  compareLabel: "전용타입 혼합",
  avgPyeongCompare: null,
  avgCompareLabel: "혼합 평균",
  provisionalFrom: null,        // "YYYY-MM"
  provisionalNote: "신고지연 · 확정 아님",
  annotateExtremes: true,
  extremesMinSample: null,      // null 이면 normalSampleFrom(8) 을 쓴다

  tableTitle: "월별 실거래 상세",
  tableDesc: "",
  table: [],

  excluded: [],
  hedges: [],
  sources: [],
  collectedAt: ""
};
const parsedTemplateData = JSON.parse(document.getElementById("ipzi-data").textContent);
const templateData = Object.keys(parsedTemplateData).length ? parsedTemplateData : templateDataShape;
</script>

<script>
(function(){
  var D = templateData || {};

  /* 스프라이트에 실재하는 심볼만 허용한다. 없는 id 를 <use> 로 가리키면
     브라우저는 에러 없이 빈 자리를 그린다. 심볼을 추가·삭제하면 이 배열도 같이 고칠 것. */
  var ICONS = ["i-trend","i-won","i-sample","i-calendar2","i-area","i-info","i-source"];
  function iconId(id){
    if(id && ICONS.indexOf(id) === -1){
      console.warn('[result.html] 스프라이트에 없는 아이콘 id: "' + id + '" — 기본값으로 대체합니다.');
      return "i-info";
    }
    return id || "i-info";
  }

  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  /* esc() 는 스킴을 막지 못한다. `javascript:alert(1)` 은 따옴표가 없어 그대로 href 에 들어간다.
     링크는 https 만 허용하고, 아니면 링크를 걸지 않는다. */
  function safeHttpsUrl(value){
    try {
      var url = new URL(String(value == null ? "" : value));
      if(url.protocol !== "https:") return null;
      return url.href;
    } catch (_) { return null; }
  }
  function g(id){ return document.getElementById(id); }
  function set(id, v){ var e = g(id); if(e && v != null && v !== "") e.textContent = v; }

  /* 결측은 0이 아니다. 0으로 채우면 "거래 없음"이 "가장 싸다"로 뒤집힌다.
     차트에서도 선을 끊고, 표에서는 '거래 없음'으로 적는다. */
  function isNil(v){ return v === null || v === undefined || v === ""; }
  function num(v){ return isNil(v) ? "정보없음" : Number(v).toLocaleString(); }

  set("brand", D.brand || "IPZI TALK");
  set("title", D.title || "실거래 추이 분석");
  set("subtitle", D.subtitle);
  set("chart-title", D.chartTitle);
  set("table-title", D.tableTitle);
  set("table-desc", D.tableDesc);
  g("ttl-ic").setAttribute("href", "#" + iconId(D.iconId || "i-trend"));

  if(D.pill && D.pill.label){
    g("pill").style.display = "";
    g("pill-dot").className = "sdot s-" + (D.pill.cls || "x");
    set("pill-label", D.pill.label);
  }

  if(D.areaNote){
    g("area-callout").style.display = "";
    set("area-title", D.areaTitle || "전용타입 고정");
    g("area-body").textContent = D.areaNote;
  }

  g("kpis").innerHTML = (D.kpis || []).map(function(k){
    var tone = k.tone ? " " + esc(k.tone) : "";
    return '<div class="metric"><div class="n' + tone + '">' + esc(k.n) + '</div>'
         + '<div class="l">' + esc(k.l) + '</div></div>';
  }).join("");

  /* ── 차트 ────────────────────────────────────────────────────────────
     series: [{ ym, pyeong, price, n }] · 거래 없는 달은 pyeong=null, n=0.
     좌표를 데이터에서 계산한다. 하드코딩하면 달 수가 바뀔 때 조용히 깨진다. */
  var S = (D.series || []);
  var W = 720, H = 300, L = 58, R = 702, T = 18, B = 236;   // B 아래는 축 라벨 영역
  var svg = g("chart");
  /* 범례가 참조한다. series 가 비어도 정의돼 있어야 한다.
     -1 = 신고지연 구간 없음(provisionalFrom 미지정 또는 시계열 범위 밖). */
  var provIdx = -1;
  /* 신고지연 구간이 있어도 그 달에 거래가 없으면 주황 점은 하나도 안 그려진다.
     그때 범례에 점 견본을 실으면 또 없는 레이어를 광고하는 것이다(v1.1.1 과 같은 부류).
     경계선에는 자체 라벨이 붙으므로 범례에서 빠져도 잃는 정보가 없다.
     실측: 신고지연 달의 타입군 거래가 0건이라 주황 점이 하나도 그려지지 않은 사례가 있다. */
  var provDot = false;

  if(!S.length){
    svg.innerHTML = '<text x="' + (W/2) + '" y="' + (H/2) + '" text-anchor="middle" '
      + 'fill="var(--sub)" font-size="13">표시할 거래 자료가 없습니다.</text>';
  } else {
    var vals = S.map(function(d){ return isNil(d.pyeong) ? null : Number(d.pyeong); });

    /* 대조선은 선택 레이어다. 달 수가 어긋나면 좌표가 밀리므로 길이가 다르면 버린다. */
    var C = (D.compareSeries && D.compareSeries.length === S.length) ? D.compareSeries : null;
    if(D.compareSeries && !C) console.warn('[result.html] compareSeries 길이가 series 와 달라 대조선을 그리지 않습니다.');
    var cvals = C ? C.map(function(d){ return isNil(d.pyeong) ? null : Number(d.pyeong); }) : [];

    /* y 범위는 그릴 모든 계열·수평선을 포함해야 한다. 주계열만 보면 대조선이 축 밖으로 나간다. */
    var live = vals.filter(function(v){ return v !== null; })
      .concat(cvals.filter(function(v){ return v !== null; }))
      .concat([D.avgPyeong, D.avgPyeongCompare].filter(function(v){ return !isNil(v); }).map(Number));
    var lo = live.length ? Math.min.apply(null, live) : 0;
    var hi = live.length ? Math.max.apply(null, live) : 1;
    /* 폭을 10% 넉넉히. 상하한이 같으면(1개월) 0 division 이 난다. */
    var pad = (hi - lo) * 0.18 || Math.max(hi * 0.05, 1);
    lo -= pad; hi += pad;

    var n = S.length;
    var x = function(i){ return n === 1 ? (L + R) / 2 : L + (R - L) * i / (n - 1); };
    var y = function(v){ return B - (B - T) * (v - lo) / (hi - lo); };
    var out = [];

    // y축 눈금 3개 + 가로 격자
    for(var t = 0; t <= 2; t++){
      var v = lo + (hi - lo) * t / 2, yy = y(v);
      out.push('<line x1="' + L + '" y1="' + yy.toFixed(1) + '" x2="' + R + '" y2="' + yy.toFixed(1)
        + '" stroke="var(--line2)" stroke-width="1"/>');
      out.push('<text x="' + (L - 8) + '" y="' + (yy + 4).toFixed(1) + '" text-anchor="end" '
        + 'fill="var(--sub2)" font-size="10" font-family="var(--mono)">' + Math.round(v).toLocaleString() + '</text>');
    }

    /* 신고지연 구간. 이 달부터는 표본이 채워지는 중이라 확정값이 아니다.
       추세 판정에 쓰면 아직 안 들어온 거래를 "없는 하락"으로 읽는다. */
    if(D.provisionalFrom){
      for(var pi = 0; pi < n; pi++){
        if(String(S[pi].ym) >= String(D.provisionalFrom)){ provIdx = pi; break; }
      }
    }
    function isProv(i){ return provIdx >= 0 && i >= provIdx; }

    // ① 거래 없는 달: 회색 밴드 + "거래없음". 선이 왜 끊겼는지 글자로도 말한다.
    var half = n > 1 ? (R - L) / (n - 1) / 2 : 40;
    S.forEach(function(d, i){
      if(!isNil(d.pyeong)) return;
      out.push('<rect x="' + (x(i) - half).toFixed(1) + '" y="' + T + '" width="' + (half * 2).toFixed(1)
        + '" height="' + (B - T) + '" fill="var(--x-s)" opacity=".75"/>');
      out.push('<text x="' + x(i).toFixed(1) + '" y="' + (B - 8) + '" text-anchor="middle" '
        + 'fill="var(--sub2)" font-size="8.5" opacity=".85">거래없음</text>');
    });

    // ② 확정 / 신고지연 경계선
    if(provIdx > 0){
      var bx = ((x(provIdx - 1) + x(provIdx)) / 2).toFixed(1);
      out.push('<line x1="' + bx + '" y1="' + T + '" x2="' + bx + '" y2="' + B
        + '" stroke="var(--o)" stroke-width="1" stroke-dasharray="3 3" opacity=".55"/>');
      out.push('<text x="' + (Number(bx) + 4) + '" y="' + (T + 8) + '" fill="var(--o)" '
        + 'font-size="8.5" opacity=".9">' + esc(D.provisionalNote || "신고지연 · 확정 아님") + '</text>');
    } else if(provIdx === 0){
      /* 첫 달부터 전부 신고지연이면 경계선을 그을 자리가 없다.
         침묵하면 화면에서 "확정 아님"이라는 말이 사라진다. 왼쪽 위에 적는다. */
      out.push('<text x="' + (L + 4) + '" y="' + (T + 8) + '" fill="var(--o)" '
        + 'font-size="8.5" opacity=".9">' + esc(D.provisionalNote || "전 구간 신고지연 · 확정 아님") + '</text>');
    }

    /* 결측에서 끊어 그리는 폴리라인. 이어 그리면 없는 거래를 지어내는 것이다. */
    function segments(arr, attrs){
      var seg = [], res = [];
      arr.forEach(function(v, i){
        if(v === null){ if(seg.length > 1) res.push('<polyline points="' + seg.join(" ") + '" ' + attrs + '/>'); seg = []; return; }
        seg.push(x(i).toFixed(1) + "," + y(v).toFixed(1));
      });
      if(seg.length > 1) res.push('<polyline points="' + seg.join(" ") + '" ' + attrs + '/>');
      return res;
    }

    // ③ 대조선(다른 전용타입을 섞은 값) — 회색 파선 5 4. 이 패턴은 대조선 전용이다.
    if(C){
      out = out.concat(segments(cvals,
        'fill="none" stroke="var(--x)" stroke-width="1.8" stroke-dasharray="5 4"'));
    }

    // ④ 이동평균 — 주계열의 평활이므로 계열색을 옅게 쓴다. 결측월은 건너뛰고 앞뒤 실측만.
    var mw = Number(D.maWindow) || 0;
    if(mw >= 2){
      var mvals = [];
      for(var i = 0; i < n; i++){
        var acc = [], j = i;
        while(j >= 0 && acc.length < mw){ if(vals[j] !== null) acc.push(vals[j]); j--; }
        mvals.push(acc.length === mw ? acc.reduce(function(a, b){ return a + b; }, 0) / mw : null);
      }
      out = out.concat(segments(mvals,
        'fill="none" stroke="var(--brand)" stroke-width="2" stroke-opacity=".35" '
        + 'stroke-linecap="round" stroke-linejoin="round"'));
    }

    // ⑤ 주계열
    out = out.concat(segments(vals,
      'fill="none" stroke="var(--brand)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"'));

    /* ⑥ 기간 평균선 — 계열색 + 촘촘한 점선 2 3 + 우측 값 라벨.
       대조선의 5 4 와 반드시 달라야 한다. 겹치면 두 라벨을 벌린다. */
    var avgRows = [];
    if(!isNil(D.avgPyeong))        avgRows.push({v: Number(D.avgPyeong),        c: "var(--brand)", t: D.avgLabel || "평균"});
    if(!isNil(D.avgPyeongCompare)) avgRows.push({v: Number(D.avgPyeongCompare), c: "var(--x)",     t: D.avgCompareLabel || "혼합 평균"});
    avgRows.forEach(function(a){
      a.y = y(a.v);
      out.push('<line x1="' + L + '" y1="' + a.y.toFixed(1) + '" x2="' + R + '" y2="' + a.y.toFixed(1)
        + '" stroke="' + a.c + '" stroke-width="1.2" stroke-dasharray="2 3"/>');
    });
    if(avgRows.length === 2 && Math.abs(avgRows[0].y - avgRows[1].y) < 15){
      var up = avgRows[0].y <= avgRows[1].y ? avgRows[0] : avgRows[1];
      var dn = up === avgRows[0] ? avgRows[1] : avgRows[0];
      up.ly = up.y - 4; dn.ly = dn.y + 13;
    }
    avgRows.forEach(function(a){
      out.push('<text x="' + (R - 3) + '" y="' + (isNil(a.ly) ? a.y - 4 : a.ly).toFixed(1)
        + '" text-anchor="end" fill="' + a.c + '" font-size="9" font-family="var(--mono)">'
        + esc(a.t) + " " + Math.round(a.v).toLocaleString() + '</text>');
    });

    /* ⑦ 점. 속 빈 점 = 판정에 쓰지 않은 달. 테두리 색이 이유를 말한다.
       파랑 테두리 = 표본 부족(<thin) · 주황 테두리 = 신고지연(확정 아님). */
    var thin = Number(D.thinSampleUnder) || 4;
    S.forEach(function(d, i){
      var v = vals[i];
      if(v !== null){
        var prov = isProv(i), t = Number(d.n) < thin;
        var ring = prov ? "var(--o)" : "var(--brand)";
        var fill = (prov || t) ? "var(--card)" : "var(--brand)";
        if(prov) provDot = true;   // 범례는 실제로 그린 점만 광고한다
        out.push('<circle cx="' + x(i).toFixed(1) + '" cy="' + y(v).toFixed(1) + '" r="4" '
          + 'fill="' + fill + '" stroke="' + ring + '" stroke-width="2"/>');
      }
      out.push('<text x="' + x(i).toFixed(1) + '" y="' + (B + 18) + '" text-anchor="middle" '
        + 'fill="var(--sub2)" font-size="9.5" font-family="var(--mono)">' + esc(String(d.n)) + '</text>');
      var lbl = String(d.ym || "").slice(2).replace("-", ".");
      out.push('<text x="' + x(i).toFixed(1) + '" y="' + (B + 36) + '" text-anchor="middle" '
        + 'fill="var(--sub)" font-size="10">' + esc(lbl) + '</text>');
    });
    out.push('<text x="' + (L - 8) + '" y="' + (B + 18) + '" text-anchor="end" '
      + 'fill="var(--sub2)" font-size="9.5">건수</text>');

    /* ⑧ 고점·저점 — 확정창 안에서만 찾는다. 신고지연 달이 고점이면 아직 확정이 아니다.
       표본 부족한 달도 제외한다. 거래 1건이 그달 중위값이 되어 가짜 극점을 만든다. */
    if(D.annotateExtremes !== false){
      /* 고점·저점은 **정상 표본**(기본 8건)에서만 찾는다.
         `thin`(4건)으로 두면 4건짜리 달의 중위값이 7건짜리를 0.15% 차이로 이기고 고점이 된다.
         실측 사례: n=4 인 달(11,806)이 n=7 인 달(11,788)을 0.15% 차이로 이겨 고점이 됐다. 그 차이로 고점을 선언할 수 없다. */
      var minExt = Number(D.extremesMinSample) || Number(D.normalSampleFrom) || 8;
      var cand = [];
      for(var i = 0; i < n; i++){
        if(vals[i] === null || isProv(i) || Number(S[i].n) < minExt) continue;
        cand.push(i);
      }
      if(cand.length >= 2){
        var hiI = cand[0], loI = cand[0];
        cand.forEach(function(i){ if(vals[i] > vals[hiI]) hiI = i; if(vals[i] < vals[loI]) loI = i; });
        if(hiI !== loI){
          [[hiI, "확정창 고점", -1], [loI, "확정창 저점", 1]].forEach(function(m){
            var i = m[0], dir = m[2], cy = y(vals[i]);
            out.push('<circle cx="' + x(i).toFixed(1) + '" cy="' + cy.toFixed(1)
              + '" r="6.2" fill="none" stroke="var(--brand)" stroke-width="1.2" opacity=".45"/>');
            var ty = dir < 0 ? cy - 11 : cy + 18;
            if(ty < T + 8) ty = cy + 18;
            if(ty > B - 2) ty = cy - 11;
            out.push('<text x="' + x(i).toFixed(1) + '" y="' + ty.toFixed(1) + '" text-anchor="middle" '
              + 'fill="var(--brand)" font-size="9.5" font-weight="700">' + m[1] + '</text>');
          });
        }
      }
    }

    svg.innerHTML = out.join("");
  }

  /* 범례는 차트에 실제로 그린 레이어만 싣는다. 안 그린 걸 적으면 지도에 없는 길을 그리는 것과 같다. */
  var hasCmp = !!(D.compareSeries && D.series && D.compareSeries.length === D.series.length);
  g("legend").innerHTML =
      '<span class="li"><span class="sw" style="background:var(--brand)"></span>중위 평당가 (주계열)</span>'
    + (Number(D.maWindow) >= 2 ? '<span class="li"><span class="sw ma"></span>'
        + esc(D.maWindow) + '개월 이동평균</span>' : '')
    + (hasCmp ? '<span class="li"><span class="sw cmp"></span>' + esc(D.compareLabel || "전용타입 혼합") + '</span>' : '')
    + (!isNil(D.avgPyeong) || !isNil(D.avgPyeongCompare)
        ? '<span class="li"><span class="sw avg"></span>기간 평균</span>' : '')
    + '<span class="li"><span class="dot solid"></span>표본 충분</span>'
    + '<span class="li"><span class="dot"></span>표본 부족 (판정 유보)</span>'
    + (provDot ? '<span class="li"><span class="dot prov"></span>신고지연 (확정 아님)</span>' : '')
    + '<span class="li"><span class="band"></span>거래 없음</span>';

  /* 태그는 `n` 과 `provisionalFrom` 에서 파생한다. 데이터의 `tag` 문자열 하나로는
     "표본 부족"과 "신고지연"이 겹칠 때 하나가 지워진다. 실측에서 n=2 인 신고지연 달의
     `판정 유보` 가 사라졌다. 두 사실은 서로를 대체하지 않는다. */
  var THIN = Number(D.thinSampleUnder) || 4;
  var NORMAL = Number(D.normalSampleFrom) || 8;
  function ymKey(v){ return String(v == null ? "" : v).replace(/\./g, "-"); }
  g("table-body").innerHTML = (D.table || []).map(function(r){
    var cnt = Number(r.n), tags = [];
    /* [주의] `거래 없음`(n=0)은 `판정 유보`(n<4)와 다른 상태다. 0 도 4 미만이라고 둘 다 붙이면
       거래가 드문 단지에서 모든 행에 `판정 유보` 가 달려 태그가 정보를 잃는다.
       실측: 13행 중 7행이 거래 0건인 단지에서 13행 전부 같은 태그가 됐다.
       거래가 없다는 사실은 값 칸이 이미 말한다. */
    var noTrade = cnt === 0 || isNil(r.pyeong);
    if(!noTrade && !isNil(r.n) && !isNaN(cnt)){
      if(cnt < THIN)        tags.push('<span class="tag hold">판정 유보</span>');
      else if(cnt < NORMAL) tags.push('<span class="tag thin">표본 부족</span>');
    } else if(!noTrade && r.tag === "hold") tags.push('<span class="tag hold">판정 유보</span>');
    else if(!noTrade && r.tag === "thin")   tags.push('<span class="tag thin">표본 부족</span>');
    /* 신고지연은 거래가 0건이어도 유효하다 — "아직 안 들어왔다"는 뜻이기 때문이다. */
    if(D.provisionalFrom && ymKey(r.ym) >= ymKey(D.provisionalFrom))
      tags.push('<span class="tag prov">신고지연</span>');
    var note = [tags.join(" "), r.note ? esc(r.note) : ""].filter(Boolean).join(" ");
    var empty = isNil(r.pyeong);
    return '<tr><td>' + esc(r.ym) + '</td>'
      + '<td class="num">' + esc(String(r.n)) + '</td>'
      + '<td class="num' + (empty ? " muted" : "") + '">' + (empty ? "거래 없음" : num(r.pyeong)) + '</td>'
      + '<td class="num' + (empty ? " muted" : "") + '">' + (empty ? "—" : num(r.price)) + '</td>'
      + '<td>' + note + '</td></tr>';
  }).join("");

  var ex = D.excluded || [];
  if(ex.length){
    g("ex-panel").style.display = "";
    g("ex-list").innerHTML = ex.map(function(e){
      return '<div class="row"><span class="ym">' + esc(e.ym) + '</span><span>' + esc(e.reason) + '</span></div>';
    }).join("");
  }

  g("hedges").innerHTML = (D.hedges || []).map(function(h){ return '<li>' + esc(h) + '</li>'; }).join("");
  g("sources").innerHTML = "출처: " + (D.sources || []).map(function(s){
    var u = safeHttpsUrl(s.url);
    return u ? '<a class="footlink" href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(s.label) + '</a>'
             : esc(s.label);
  }).join(" · ") + (D.collectedAt ? " · 조회일 " + esc(D.collectedAt) : "");
})();
</script>
</body>
</html>
